<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Referrals Completed</title>
<!-- Public, embeddable. Reads monthly totals only, through public_completed_by_month();
     the public key it carries cannot read a single referral (RLS). -->
<style>
  :root { --bar: #2A6FBF; --ink: #1f2933; --muted: #6b7280; --rule: #d9dde3; --bg: #fff; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<h1>Referrals completed</h1>
<p id="sub">Loading…</p>
<div id="chart"></div>
<script>
const URL_ = 'https://pokjjlvrtakarcnblljh.supabase.co/rest/v1/rpc/public_completed_by_month';
const KEY = 'sb_publishable_Tciww7ztWF4Nfqve_E_ZHg_TPlLgTlg';   // public by design
const NAMES = 'JanFebMarAprMayJunJulAugSepOctNovDec';
const label = k => NAMES.substr((+k.slice(5) - 1) * 3, 3) + ' ' + k.slice(2, 4);

fetch(URL_, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: '{}' })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(rows => {
    const got = new Map(rows.map(r => [r.month, r.completed]));
    const now = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit' })
      .format(new Date()).slice(0, 7);
    const months = [];   // every month from Jan 2026, so a quiet month shows as zero, not a gap
    for (let y = 2026, m = 1; `${y}-${String(m).padStart(2, '0')}` <= now; m === 12 ? (y++, m = 1) : m++)
      months.push(`${y}-${String(m).padStart(2, '0')}`);
    const data = months.map(k => ({ k, n: got.get(k) || 0 }));
    const total = data.reduce((s, d) => s + d.n, 0);
    document.getElementById('sub').textContent =
      `${total.toLocaleString('en-GB')} referrals completed since January 2026, by month. ${label(now)} is the month so far.`;

    const slot = 44, H = 240, top = 20, bottom = 24, W = data.length * slot, bw = 30;
    const max = Math.max(1, ...data.map(d => d.n)), plot = H - top - bottom;
    const bars = data.map((d, i) => {
      const h = d.n / max * plot, x = i * slot + (slot - bw) / 2, y = top + plot - h, cur = d.k === now;
      return `<g><title>${label(d.k)}: ${d.n} completed${cur ? ' so far' : ''}</title>
        <rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="var(--bar)" opacity="${cur ? .45 : 1}"/>
        <text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${d.n}</text>
        <text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="10" fill="var(--muted)">${label(d.k)}</text></g>`;
    }).join('');
    document.getElementById('chart').innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Referrals completed per month">
        <line x1="0" x2="${W}" y1="${top + plot}" y2="${top + plot}" stroke="var(--rule)"/>${bars}</svg>`;
  })
  .catch(() => { document.getElementById('sub').textContent = 'The chart could not be loaded just now.'; });
</script>
</body>
</html>
