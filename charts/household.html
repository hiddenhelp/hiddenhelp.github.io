<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adults and Children</title>
<!-- Public, embeddable. Reads monthly totals only, through public_household_by_month();
     the public key it carries cannot read a single referral (RLS).
     completed_chart.html and household_chart.html share everything below the CONFIG block. -->
<style>
  /* Lays out at the size of whatever box it is embedded in (Wix sizes the frame, not the page):
     text eases down on a small box, the bars take what is left, and nothing scrolls. */
  :root { --a: #2A6FBF; --b: #D0602A; --ink: #1f2933; --muted: #6b7280; --rule: #d9dde3; --bg: #fff; }
  html, body { height: 100%; }
  body { margin: 0; padding: clamp(6px, 3vw, 12px); box-sizing: border-box; display: flex; flex-direction: column;
         overflow: hidden; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: clamp(13px, 5vw, 17px); line-height: 1.2; font-weight: 600; margin: 0 0 2px; }
  p { font-size: clamp(10px, 3.6vw, 12px); line-height: 1.3; margin: 0 0 4px; color: var(--muted); }
  .key { display: flex; gap: 12px; font-size: clamp(10px, 3.6vw, 12px); color: var(--muted); margin: 0 0 2px; }
  .key:empty { display: none; }
  .key i { display: inline-block; width: .8em; height: .8em; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #chart { flex: 1; min-height: 60px; }
  svg { display: block; }
</style>
</head>
<body>
<h1>Adults and children in referrals</h1>
<p id="sub">Loading…</p>
<div class="key"><span><i style="background:var(--a)"></i>Adults</span><span><i style="background:var(--b)"></i>Children</span></div>
<div id="chart"></div>
<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const FN = 'public_household_by_month';
const SERIES = [{ f: 'adults', c: 'a', label: 'adults' }, { f: 'children', c: 'b', label: 'children' }];   // stacked bottom-up
const SUB = (t, now) => `${t.adults} adults and ${t.children} children in referrals since January 2026, by the month the referral came in. ${now} is the month so far.`;
// ────────────────────────────────────────────────────────────────────────────
const URL_ = 'https://pokjjlvrtakarcnblljh.supabase.co/rest/v1/rpc/' + FN;
const KEY = 'sb_publishable_Tciww7ztWF4Nfqve_E_ZHg_TPlLgTlg';   // public by design
const NAMES = 'JanFebMarAprMayJunJulAugSepOctNovDec';
const mon = k => NAMES.substr((+k.slice(5) - 1) * 3, 3);
const label = k => mon(k) + ' ' + k.slice(2, 4);
const now = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit' })
  .format(new Date()).slice(0, 7);
let data = [];

// Drawn in real pixels for the box it is in, and again on every resize, so the text stays a
// readable size and only the bars stretch or squeeze.
function draw() {
  const el = document.getElementById('chart'), W = el.clientWidth, H = el.clientHeight;
  if (!data.length || !W || !H) return;
  const slot = W / data.length, bw = Math.max(3, Math.min(30, slot * .7)), top = 16, bottom = 16;
  const plot = Math.max(10, H - top - bottom), base = top + plot;
  const max = Math.max(1, ...data.map(d => SERIES.reduce((s, x) => s + d[x.f], 0)));
  const long = slot >= 40, every = long ? 1 : Math.ceil(24 / slot);   // "Jan 26", else "Jan" every nth month
  const values = slot >= 18;
  const bars = data.map((d, i) => {
    const x = i * slot + (slot - bw) / 2, cur = d.k === now, op = cur ? .45 : 1;
    let y = base, segs = '';
    for (const s of SERIES) {
      const h = d[s.f] / max * plot;
      if (h > 0) {
        y -= h;
        segs += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h - (SERIES.length > 1 ? 2 : 0), 1)}" rx="${Math.min(3, bw / 4)}" fill="var(--${s.c})" opacity="${op}"/>`;
        if (SERIES.length > 1 && values && h >= 14 && bw >= 16)
          segs += `<text x="${x + bw / 2}" y="${y + 11}" text-anchor="middle" font-size="9" fill="#fff">${d[s.f]}</text>`;
      }
    }
    const total = SERIES.reduce((s, x) => s + d[x.f], 0);
    const tip = SERIES.length > 1 ? SERIES.map(s => `${d[s.f]} ${s.label}`).join(', ') : `${total} ${SERIES[0].label}`;
    return `<g><title>${label(d.k)}: ${tip}${cur ? ' so far' : ''}</title>${segs}
      ${values ? `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--ink)">${total}</text>` : ''}
      ${i % every === 0 ? `<text x="${x + bw / 2}" y="${H - 3}" text-anchor="middle" font-size="9" fill="var(--muted)">${long ? label(d.k) : mon(d.k)}</text>` : ''}</g>`;
  }).join('');
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${document.title} per month">
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--rule)"/>${bars}</svg>`;
}

fetch(URL_, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: '{}' })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(rows => {
    const got = new Map(rows.map(r => [r.month, r]));
    const months = [];   // every month from Jan 2026, so a quiet month shows as zero, not a gap
    for (let y = 2026, m = 1; `${y}-${String(m).padStart(2, '0')}` <= now; m === 12 ? (y++, m = 1) : m++)
      months.push(`${y}-${String(m).padStart(2, '0')}`);
    data = months.map(k => Object.fromEntries([['k', k], ...SERIES.map(s => [s.f, got.get(k)?.[s.f] || 0])]));
    const t = Object.fromEntries(SERIES.map(s => [s.f, data.reduce((n, d) => n + d[s.f], 0).toLocaleString('en-GB')]));
    document.getElementById('sub').textContent = SUB(t, label(now));
    draw();
    new ResizeObserver(draw).observe(document.getElementById('chart'));
  })
  .catch(() => { document.getElementById('sub').textContent = 'The chart could not be loaded just now.'; });
</script>
</body>
</html>
