<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidden Help Admin</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Sora+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
/* ── Variables ─────────────────────────────────────────────── */
:root {
  --bg:        #F4F5F1;
  --bg2:       #EAECE5;
  --bg3:       #DFE2D9;
  --panel:     #FFFFFF;
  --border:    #D6DACF;
  --text:      #181A17;
  --text2:     #535A51;
  --text3:     #6B7367;
  --accent:        #2E6B4E;
  --accent-bg:     #E8EEEB;
  --accent-border: #A9CBB6;
  --accent-hover:  #D7E7DD;
  --green:     #3A7D44;
  --green-bg:  #E8F4EA;
  --blue:      #1A5FA8;
  --blue-bg:   #E5EFFE;
  --amber:     #8A6000;
  --amber-bg:  #FEF3D8;
  --red:       #9B2020;
  --red-bg:    #FDEAEA;
  --purple:    #5B3D8A;
  --purple-bg: #F0EAFE;
  --radius:    8px;
  --radius-sm: 5px;
  --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --font:      'Sora', sans-serif;
  --sidebar-w: 380px;
}

/* ── Reset ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font); font-size: 14px; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
button { font-family: var(--font); cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: var(--font); }
a { color: inherit; text-decoration: none; }

/* ── Login ─────────────────────────────────────────────────── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}
.login-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 48px 40px;
  width: 100%;
  max-width: 380px;
  box-shadow: var(--shadow);
  text-align: center;
}
.login-logo {
  font-size: 22px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -.3px;
  margin-bottom: 6px;
}
.login-sub {
  font-size: 13px;
  color: var(--text3);
  margin-bottom: 36px;
}
.login-label {
  display: block;
  text-align: left;
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: 6px;
}
.login-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
.login-input:focus { border-color: var(--accent); }
.login-btn {
  width: 100%;
  margin-top: 16px;
  padding: 11px;
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  transition: opacity .15s;
}
.login-btn:hover { opacity: .88; }
.login-btn:disabled { opacity: .5; cursor: not-allowed; }
.login-msg {
  margin-top: 16px;
  font-size: 13px;
  color: var(--text2);
  min-height: 20px;
}
.login-msg.ok  { color: var(--green); }
.login-msg.err { color: var(--red); }
.phone-warn { color: var(--red); font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; vertical-align: text-bottom; }
.phone-warn svg { flex-shrink: 0; }

/* ── App shell ─────────────────────────────────────────────── */
#app { display: none; height: 100vh; flex-direction: column; }
#app.visible { display: flex; }

.app-header {
  height: 48px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
  z-index: 10;
}
.app-logo {
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -.2px;
  margin-right: auto;
}
.user-email {
  font-size: 12px;
  color: var(--text3);
}
.sign-out-btn {
  font-size: 12px;
  color: var(--text2);
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  transition: background .15s;
}
.sign-out-btn:hover { background: var(--bg2); }
@media (max-width: 600px) { .app-header { height: auto; min-height: 48px; padding: 8px 14px; flex-wrap: wrap; gap: 8px; } }

.app-body {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Sidebar ───────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-top {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}
.search-input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  outline: none;
}
.search-input:focus { border-color: var(--accent); }
/* author-styled search fields lose WebKit's clear button — put it back */
.search-input::-webkit-search-cancel-button { -webkit-appearance: searchfield-cancel-button; }
.filter-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.pill {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 99px;
  border: 1px solid var(--border);
  color: var(--text2);
  background: var(--bg);
  cursor: pointer;
  transition: all .12s;
  white-space: nowrap;
}
.pill.active {
  background: var(--accent-bg);
  border-color: var(--accent-border);
  color: var(--accent);
  font-weight: 500;
}
.pill-sep {
  margin: 0 3px;
  opacity: 0.4;
}
#town-filter {
  font-size: 11px;
  padding: 3px 6px;
  border-radius: 99px;
  border: 1px solid var(--border);
  color: var(--text2);
  background: var(--bg);
  cursor: pointer;
  flex-shrink: 0;
  max-width: 130px;
}
#town-filter.active {
  background: var(--accent-bg);
  border-color: var(--accent-border);
  color: var(--accent);
  font-weight: 500;
}
.pill-count {
  font-size: 11px;
  opacity: 0.6;
  font-weight: 400;
}
.ref-list {
  flex: 1;
  overflow-y: auto;
}
.ref-list-empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--text3);
  font-size: 13px;
}

/* ── Referral list item ────────────────────────────────────── */
.ref-item {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s;
}
.ref-item:hover { background: var(--bg); }
.ref-item.selected {
  background: var(--accent-bg);
  border-left: 3px solid var(--accent);
  padding-left: 11px;
}
.ref-item-top {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 3px 8px;
  align-items: baseline;
  margin-bottom: 3px;
}
.ref-id-tags {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  min-width: 0;
}
.ref-num { font-size: 13px; font-weight: 600; color: var(--text); }
/* Not yet numbered: admin allocates in the sheet and the ingest copies it over.
   Styled as a state rather than a blank so it reads as "waiting on you". */
.ref-num.unnumbered { color: var(--text3); font-weight: 500; font-style: italic; }
.ref-date { font-size: 11px; color: var(--text3); white-space: nowrap; justify-self: end; }
/* Name and post town share a line — deliveries get a town on the right,
   collections get nothing. The referrer organisation used to have a line of
   its own below; still searchable, just not worth the height. */
.ref-name { font-size: 13px; color: var(--text);
            display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; }
.ref-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-town { font-size: 11px; color: var(--text3); white-space: nowrap; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 99px;
}
.tag-delivery   { background: var(--blue-bg);   color: var(--blue); }
.tag-collection { background: var(--green-bg);  color: var(--green); }
.tag-new        { background: var(--bg2);        color: var(--text2); }
.tag-wishlist   { background: var(--amber-bg);  color: var(--amber); }
.tag-gathered   { background: var(--purple-bg); color: var(--purple); }
.tag-completed  { background: var(--green-bg);  color: var(--green); }
.tag-cancelled  { background: var(--red-bg);    color: var(--red); }
.tag-rejected   { background: var(--bg3);        color: var(--text2); }
/* Outlined, not filled: every other tag in this row marks a milestone reached,
   this one marks the absence of one. Inset ring so the box size still matches. */
.tag-untriaged  { background: transparent;       color: var(--text3); box-shadow: inset 0 0 0 1px var(--border); }
.tag-crisis     { background: var(--bg2);        color: var(--text2); }
.tag-vuln       { background: var(--red-bg);    color: var(--red); }

/* ── Detail panel ──────────────────────────────────────────── */
.detail {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
.detail-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  font-size: 13px;
}
.detail-header {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-shrink: 0;
}
.detail-header-left h2 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.2px;
  margin-bottom: 3px;
}
.detail-header-left p { font-size: 12px; color: var(--text2); }
.detail-actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn-done { border-color: var(--green); color: var(--green); background: var(--green-bg); }
.btn-done:hover { background: var(--green-bg); filter: brightness(.97); }
.btn {
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  transition: background .12s;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn svg { flex-shrink: 0; }
.btn:hover { background: var(--bg2); }
.btn-maps { background: var(--blue-bg); border-color: #B5CEFF; color: var(--blue); }
.btn-maps:hover { background: #D8E8FF; }
.detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── Stat row ──────────────────────────────────────────────── */
.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.stat {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
}
.stat label {
  font-size: 11px;
  color: var(--text3);
  display: block;
  margin-bottom: 3px;
  font-weight: 500;
}
.stat span { font-size: 14px; font-weight: 500; }
.stat-completed { color: var(--green); }
.stat-gathered  { color: var(--purple); }
.stat-cancelled { color: var(--red); }
.stat-wishlist  { color: var(--amber); }
.stat-new       { color: var(--text2); }
.stat-untriaged { color: var(--text3); }

/* ── Cards ─────────────────────────────────────────────────── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.card-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 10px;
}
.card-title-row {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}
.card-title-row .card-title { margin-bottom: 0; flex: 1; }
.field { margin-bottom: 8px; }
.field:last-child { margin-bottom: 0; }
.field label { font-size: 11px; color: var(--text3); display: block; margin-bottom: 2px; font-weight: 500; }
.field span, .field a { font-size: 13px; color: var(--text); }
.field a { color: var(--blue); }
.field a:hover { text-decoration: underline; }
.address-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 10px;
}
.address-note { font-size: 11px; color: var(--text3); margin-top: 4px; }
.address-note svg { vertical-align: -3px; }
/* Shown only on a partial match, where the card carries two addresses and
   neither is meaningful without knowing which is which. */
.address-label { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--text3); margin-bottom: 2px; }
.address-given { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); color: var(--text2); }

/* ── Milestones ────────────────────────────────────────────── */
.ms-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}
.ms-row:last-child { border-bottom: none; }
.ms-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ms-dot-done    { background: var(--green); }
.ms-dot-next    { background: var(--amber); }
.ms-dot-pending { background: var(--bg3); }
.ms-label { font-size: 12px; color: var(--text2); flex: 1; }
.ms-date  { font-size: 11px; color: var(--text3); }

/* ── Wishlist items ────────────────────────────────────────── */
.item-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}
.item-row:last-child { border-bottom: none; }
.item-qty  { font-size: 12px; font-weight: 600; color: var(--text3); min-width: 24px; }
.item-name { font-size: 13px; flex: 1; }
.item-cat  { font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 99px; }
.item-qty-input { width: 46px; font-size: 12px; padding: 3px 5px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); }
.item-flag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text3); border: 1px solid var(--border); border-radius: 99px; padding: 1px 6px; margin-left: 7px; vertical-align: 1px; }
.item-drop { background: none; border: none; cursor: pointer; color: var(--text3); padding: 2px 4px; line-height: 1; border-radius: 5px; display: inline-flex; }
.item-drop:hover { color: var(--red); background: var(--bg); }
.item-drop svg { width: 15px; height: 15px; }
.item-add { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-top: 10px; margin-top: 6px; border-top: 1px dashed var(--border); }
.item-add-desc { flex: 1 1 150px; min-width: 0; font-size: 13px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
.item-add-qty  { width: 52px; font-size: 13px; padding: 5px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
.item-add-hint { font-size: 12px; color: var(--muted); flex: 1 1 100%; }
.item-add-cat  { font-size: 13px; padding: 5px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
.item-removed-block { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
.item-removed-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); margin-bottom: 6px; }
.item-removed { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 3px 0; color: var(--text3); }
.item-removed > span:first-child { text-decoration: line-through; flex: 1; }
.item-removed-by { font-size: 11px; white-space: nowrap; }
.item-undo { background: none; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; padding: 2px 8px; cursor: pointer; color: var(--text2); }
.item-undo:hover { background: var(--bg); color: var(--text); }
.triage-card { border-left: 3px solid var(--amber, #b46a12); }
.triage-note { font-size: 13px; color: var(--text3); margin-bottom: 10px; }
.triage-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.triage-row label { font-size: 12px; font-weight: 600; color: var(--text3); }
.triage-num { width: 84px; font-size: 14px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
.triage-or { font-size: 12px; color: var(--text3); }
.dup-search { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
.dup-input { width: 100%; font-size: 13px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
.dup-hit { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--border); padding: 7px 2px; cursor: pointer; color: var(--text); }
.dup-hit:hover { background: var(--bg); }
.dup-hit-num { font-size: 12px; font-weight: 700; min-width: 52px; }
.dup-hit-name { font-size: 13px; flex: 1; }
.dup-hit-date { font-size: 11px; color: var(--text3); white-space: nowrap; }
.dup-none { font-size: 12px; color: var(--text3); padding: 8px 2px; }
.dup-card { border-left: 3px solid var(--text3); }
.dup-of { font-size: 13px; margin-bottom: 10px; }
.dup-link { background: none; border: none; padding: 0; font-size: 13px; font-weight: 600; color: var(--accent, var(--text)); cursor: pointer; text-decoration: underline; }
.dup-gone { color: var(--text3); font-size: 12px; }
.triage-warn { display: flex; gap: 7px; align-items: flex-start; font-size: 12px; line-height: 1.45; color: var(--text2); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
.triage-warn svg { flex-shrink: 0; margin-top: 1px; }
.ic-general    { background: var(--bg2); color: var(--text2); }
.ic-other      { background: var(--bg2); color: var(--text3); font-style: italic; }
.ic-furniture  { background: var(--purple-bg); color: var(--purple); }
.ic-electrical { background: var(--amber-bg); color: var(--amber); }

/* ── Payment ───────────────────────────────────────────────── */
.pay-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
}
.pay-row:last-child { border-bottom: none; }
.pay-label { font-size: 12px; color: var(--text2); }
.pay-value { font-size: 12px; font-weight: 500; }

/* ── Notes ─────────────────────────────────────────────────── */
.notes-area {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  resize: vertical;
  min-height: 72px;
  outline: none;
  transition: border-color .15s;
}
.notes-area:focus { border-color: var(--accent); }
.notes-save {
  margin-top: 8px;
  font-size: 12px;
  font-weight: 500;
  padding: 6px 16px;
  background: var(--accent-bg);
  color: var(--accent);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius-sm);
  transition: background .15s;
}
.notes-save:hover { background: var(--accent-hover); }
/* The wishlist note sits above the item rows, so it needs the separation the
   Admin notes card gets for free from being its own card. */
.wl-note { margin-bottom: 14px; }
.wl-note-hint { margin-top: 6px; font-size: 11px; color: var(--text3); }

/* ── Referral number inline edit ───────────────────────────── */
.btn-edit-refnum {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px 7px;
  font-size: 12px;
  color: var(--text3);
  cursor: pointer;
  line-height: 1;
  transition: all .12s;
  vertical-align: middle;
  margin-left: 5px;
}
.btn-edit-refnum { display: inline-flex; align-items: center; }
.btn-edit-refnum:hover { color: var(--accent); border-color: var(--accent); }

/* ── Edit controls ─────────────────────────────────────────── */
.btn-edit-card {
  font-size: 11px;
  color: var(--accent);
  padding: 2px 9px;

/* Destructive, so it is the QUIETEST button here, not the loudest: solid red

/* ── Volunteers view ───────────────────────────────────────── */

}

.avail-header { flex-wrap: wrap; }
.plan-grid { display: grid; grid-template-columns: 1fr minmax(300px, 420px); gap: 16px; align-items: start; max-width: 1200px; }

.plan-map { height: 380px; border: 1px solid var(--border); border-radius: var(--radius); }

.plan-load-bar span { display: block; height: 100%; background: var(--green); }

.plan-remove:hover { color: var(--red); border-color: var(--red); }

.plan-list { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.plan-list-head { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.plan-row { display: flex; flex-direction: column; gap: 5px; padding: 9px 12px; border-bottom: 1px solid var(--bg2); cursor: pointer; font-size: 13px; }

.item-pts { font-size: 12px; color: var(--text3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.plan-items .item-row { padding: 4px 0; }
.plan-alt { font-size: 11px; color: var(--text3); white-space: nowrap; }
.plan-list-head .plan-row-nums { white-space: normal; line-height: 1.3; align-items: flex-end; }

/* Back bar (hidden on desktop) */

<!-- ── Login ──────────────────────────────────────────────── -->
<div id="login-screen">

  </header>
  <div class="app-body">

    <div class="sidebar">
      <div class="sidebar-top">

// ── Auth ────────────────────────────────────────────────────
async function initAuth() {
  const { data: { session } } = await db.auth.getSession();
  if (session) showApp(session.user);
  else         showLogin();

  db.auth.onAuthStateChange((_event, session) => {
    if (session) showApp(session.user);
    else         showLogin();
  });
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').classList.remove('visible');
}

function showApp(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('user-email').textContent = user.email;
  loadVolunteers();
  loadFormItems();
  loadReferrals();
}

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const msg   = document.getElementById('login-msg');
  const btn   = document.getElementById('login-btn');
  if (!email) { msg.textContent = 'Please enter your email address.'; msg.className = 'login-msg err'; return; }
  btn.disabled   = true;
  btn.textContent = 'Sending…';
  msg.textContent = '';
  const { error } = await db.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  btn.disabled   = false;
  btn.textContent = 'Send magic link';
  if (error) { msg.textContent = error.message; msg.className = 'login-msg err'; }
  else {
    msg.textContent = 'Check your email for a magic link or code.';
    msg.className   = 'login-msg ok';
    // Home Screen apps can't receive the magic-link session (link opens in
    // Safari's separate storage) — typing the code signs in inside the app
    document.getElementById('otp-code').focus();
  }
});

document.getElementById('otp-btn').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const token = document.getElementById('otp-code').value.trim();
  const msg   = document.getElementById('login-msg');
  const btn   = document.getElementById('otp-btn');
  if (!email)              { msg.textContent = 'Enter your email address above too.'; msg.className = 'login-msg err'; return; }
  if (!/^\d{6,10}$/.test(token)) { msg.textContent = 'Enter the code from the email.'; msg.className = 'login-msg err'; return; }
  btn.disabled    = true;
  btn.textContent = 'Verifying…';
  const { error } = await db.auth.verifyOtp({ email, token, type: 'email' });
  btn.disabled    = false;
  btn.textContent = 'Verify code';
  if (error) { msg.textContent = error.message; msg.className = 'login-msg err'; }
  // success: onAuthStateChange shows the app
});

document.getElementById('otp-code').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('otp-btn').click();
});

document.getElementById('login-email').addEventListener('keydown', e => {

});

document.getElementById('sign-out-btn').addEventListener('click', async () => {

async function loadReferrals() {

    .from('referrals')
    .select(`
      *,
      clients (*),
      referrers (*),
      wishlist_items (*),
      wishlist_corrections (*),
      referral_crisis_types ( crisis_types (name) ),
      gathered_vol:volunteers!gathered_by_id (name),
      delivered_vol:volunteers!delivered_by_id (name)

    .order('referral_number', { ascending: false, nullsFirst: true });

  if (error) { console.error(error); return; }
  allReferrals = data || [];
  if (currentView === 'planner') renderPlanner();   // a correction made from the planner

    const updated = allReferrals.find(x => x.id === selectedRef.id);
    if (updated) { selectedRef = updated; renderDetail(selectedRef); }
  }
  renderList();
}

async function loadVolunteers() {

// the gatherers find it where they expect rather than under "Other".
async function loadFormItems() {

}

// Free text still goes through: an off-form one-off is a real thing to add, and
// it reads as one — no section, so it prints under "Other".
function formItemFor(desc) {
  const k = String(desc || '').replace(/\s+/g, ' ').trim().toLowerCase();
  return formItems.find(i => i.item.replace(/\s+/g, ' ').trim().toLowerCase() === k) || null;

// Keep in step with normalisePhone in Supabase.gs — national form, 07873232433.
function normalisePhone(raw) {
  if (!raw) return null;
  const digits = String(raw).replace(/\D/g, '');
  if (!digits) return null;
  if (digits.startsWith('44') && digits.length === 12) return '0' + digits.slice(2);
  if (digits.startsWith('0')  && digits.length === 11) return digits;
  if (digits.length === 10)                            return '0' + digits;
  return digits;
}

// DBS applies to drivers only, and the expiry only to a "yes". Hidden fields
// keep their values, so unticking Driver by mistake loses nothing.
function volDbsShow() {
  const driver = document.getElementById('vf-drive').checked;
  document.getElementById('vf-dbs-wrap').style.display = driver ? '' : 'none';
  document.getElementById('vf-dbs-exp-wrap').style.display =
    driver && document.getElementById('vf-dbs').value === 'yes' ? '' : 'none';
}

// The table's DBS cell. Flags an expired check, one due within 60 days, a
// "No", and a "Yes" with no expiry date. Pure, so test_dashboard.js pins it.
function dbsStatus(v, today = new Date()) {
  if (!v.can_drive) return { text: '', level: '' };
  if (v.dbs_check === 'not_required') return { text: 'Not required', level: '' };
  if (v.dbs_check === 'no')  return { text: 'No', level: 'warn' };
  if (v.dbs_check !== 'yes') return { text: 'Not recorded', level: 'off' };
  if (!v.dbs_expiry)         return { text: 'Yes, no expiry date', level: 'warn' };
  const exp = parseYmd(v.dbs_expiry);
  const days = Math.round((exp - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
  const when = `${exp.getDate()} ${MONTH_NAMES[exp.getMonth()]} ${exp.getFullYear()}`;
  if (days < 0)   return { text: `Expired ${when}`, level: 'bad' };
  if (days <= 60) return { text: `Expires ${when}`, level: 'warn' };
  return { text: `Yes, to ${when}`, level: '' };
}

// ── Availability view ───────────────────────────────────────
// Which drivers are free when, typed in by admin. Replaces the sheet of paper that was
// photographed into the drivers' channel; "Copy summary" makes the text to
// paste there instead. Admin records it rather than volunteers, because not
// every driver is on Telegram (a poll was ruled out for that reason).
// A row in volunteer_availability means free; no row means not.
let availWeek = null;        // Monday of the week shown, 'YYYY-MM-DD'
let availRows = new Set();   // 'volunteerId|day|slot'

const DAY_NAMES   = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// Local date, never toISOString: that is UTC, and local midnight in summer
// time is still the previous day in UTC, which would file Monday under Sunday.
function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function fmtDay(s) { const d = parseYmd(s); return `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`; }

// The coming working week: the next Monday after today, so on a Monday it is
// next week, not this one. The arrows go back a week for "this week".
function nextMonday(today = new Date()) {
  const ahead = (8 - today.getDay()) % 7 || 7;
  return ymd(new Date(today.getFullYear(), today.getMonth(), today.getDate() + ahead));
}

// Drivers only: they are the limit on what goes out, and the paper only
// ever tracked them (Richard, 17 Oct 2026).
function availPeople() {
  return allVolunteers.filter(v => v.active && v.can_drive)
    .sort((a, b) => a.name.localeCompare(b.name));
}

async function loadAvailability() {
  availWeek = availWeek || nextMonday();
  const el = document.getElementById('availability-view');
  el.innerHTML = '<div class="loading">Loading availability…</div>';
  if (!allVolunteers.length) {
    const { data } = await db.from('volunteers').select('*').order('name');
    allVolunteers = data || [];
  }
  const { data, error } = await db.from('volunteer_availability')
    .select('volunteer_id, day, slot').gte('day', availWeek).lte('day', addDays(availWeek, 4));
  if (error) { el.innerHTML = `<div class="loading">Failed to load: ${esc(error.message)}</div>`; return; }
  availRows = new Set((data || []).map(r => `${r.volunteer_id}|${r.day}|${r.slot}`));
  renderAvailability();
}

function shiftAvailWeek(weeks) {
  availWeek = addDays(availWeek, 7 * weeks);
  loadAvailability();
}

// Saves on every tap, shown at once and put back if the save fails. A
// duplicate insert means another admin ticked the same box — already true.
async function toggleAvail(volId, day, slot) {
  const key = `${volId}|${day}|${slot}`;
  const on = !availRows.has(key);
  if (on) availRows.add(key); else availRows.delete(key);
  renderAvailability();
  const q = db.from('volunteer_availability');
  const { error } = on
    ? await q.insert({ volunteer_id: volId, day, slot })
    : await q.delete().eq('volunteer_id', volId).eq('day', day).eq('slot', slot);
  if (error && !(on && error.code === '23505')) {
    if (on) availRows.delete(key); else availRows.add(key);
    renderAvailability();
    alert('Save failed: ' + error.message);
  }
}

// The text for the drivers' channel. Pure, so test_dashboard.js can pin it.
function availabilitySummary(people, rows, monday) {
  const lines = [`Availability, week of ${fmtDay(monday)}`];
  for (let i = 0; i < 5; i++) {
    const day = addDays(monday, i);
    const slotLine = (slot, label) => {
      const free = people.filter(p => rows.has(`${p.id}|${day}|${slot}`)).map(p => p.name);
      return `${label}: ${free.length ? free.join(', ') : 'nobody yet'}`;
    };
    lines.push('', fmtDay(day), slotLine('am', 'AM'), slotLine('pm', 'PM'));
  }
  return lines.join('\n');
}

function copyAvailability() {
  const text = availabilitySummary(availPeople(), availRows, availWeek);
  navigator.clipboard.writeText(text).then(() => {
    flashIconBtn(document.getElementById('avail-copy-btn'), ICONS.check, 'Copied!', ICONS.copy, 'Copy summary');
  }, () => alert('Could not copy. Your browser blocked the clipboard.'));
}

function renderAvailability() {
  const el = document.getElementById('availability-view');
  const people = availPeople();
  const days = [0, 1, 2, 3, 4].map(i => addDays(availWeek, i));
  const slots = days.flatMap(day => [[day, 'am'], [day, 'pm']]);

  const rows = people.map(p => `<tr>
      <td style="white-space:nowrap">${esc(p.name)}</td>
      ${slots.map(([day, slot]) => {
        const on = availRows.has(`${p.id}|${day}|${slot}`);
        return `<td class="avail-td${slot === 'am' ? ' avail-day' : ''}"><button class="avail-cell${on ? ' on' : ''}"
          aria-pressed="${on}" aria-label="${esc(p.name)} ${fmtDay(day)} ${slot}"
          onclick="toggleAvail(${p.id}, '${day}', '${slot}')">${on ? ICONS.check : ''}</button></td>`;
      }).join('')}
    </tr>`).join('');

  const totals = slots.map(([day, slot]) => {
    const n = people.filter(p => availRows.has(`${p.id}|${day}|${slot}`)).length;
    return `<td class="avail-td${slot === 'am' ? ' avail-day' : ''}">${n || '—'}</td>`;
  }).join('');

  el.innerHTML = `
    <div class="vol-view-header avail-header">
      <h2>Availability</h2>
      <button class="btn" onclick="shiftAvailWeek(-1)" aria-label="Previous week">‹</button>
      <span class="avail-week">Week of ${fmtDay(availWeek)}</span>
      <button class="btn" onclick="shiftAvailWeek(1)" aria-label="Next week">›</button>
      <button class="btn" id="avail-copy-btn" onclick="copyAvailability()">${ICONS.copy}<span>Copy summary</span></button>
    </div>
    <div class="vol-table-wrap">
      <table class="vol-table avail-table">
        <thead>
          <tr><th rowspan="2">Driver</th>${days.map(d => `<th colspan="2" class="avail-day" style="text-align:center">${fmtDay(d)}</th>`).join('')}</tr>
          <tr>${days.map(() => '<th class="avail-day" style="text-align:center">AM</th><th style="text-align:center">PM</th>').join('')}</tr>
        </thead>
        <tbody>
          ${rows || `<tr><td colspan="11" style="color:var(--text3);text-align:center;padding:24px">No active drivers. Tick "Driver" in Volunteers.</td></tr>`}
        </tbody>
        <tfoot><tr><td class="avail-total-label">Free</td>${totals}</tr></tfoot>
      </table>
    </div>`;
}

// ── Planner view ────────────────────────────────────────────
// Which deliveries go in the van together, on one day at a time. The admin
// knows who is free; this answers what fits and what is on the way.
//
// Load: points per item, 1 point ~ a large removal box (~5 cu ft). A copy of
// load_points_draft.csv — test_dashboard.js fails if the two differ. Kept
// pessimistic on purpose (Richard, 17 Oct 2026): a wishlist is what was
// requested, not what was gathered, so a score overstates the real load.
// ponytail: hard-coded; move to a table when admins want to tune it themselves.
const LOAD_POINTS = {
  'double bed base': 7,
  'arm chair': 6,
  'sideboard': 6,
  'desk': 5,
  'double mattress': 5,
  'fridge freezer': 5,
  'bunk bed': 4,
  'chest of drawers': 4,
  'dining table': 4,
  'dressing tables': 4,
  'single bed base': 4,
  'small kitchen table': 4,
  'coffee table': 3,
  'desk chair': 3,
  'freezer': 3,
  'fridge': 3,
  'shelving unit': 3,
  'single mattress': 3,
  'bar stools': 2,
  'bedside table': 2,
  'foot stool': 2,
  'side table': 2,
  'tv stand': 2,
  'dining chair': 1,
  'tv large': 1,
  'tv small': 1,
  'floor lamp': 0.5,
  'microwave': 0.5,
  'mirror': 0.5,
  'portable heater (electric)': 0.5,
  'rug large': 0.5,
  'rug small': 0.5,
  'small stool': 0.5,
  'vacuum': 0.5,
  'wall art large': 0.5,
  'wall art small': 0.5
};
const LOAD_OTHER   = 0.1;    // every item not listed: one box per ten
// Long-wheelbase Transit: ~80 points of space with a medium roof, ~95 high.
// Was 65, an allowance for loose packing, until the item scores themselves
// took packing into account (chairs stack, things pack round tables); 80 set
// 17 Oct 2026 with the roof height unconfirmed. Of 302 completed deliveries,
// 2% score over 80.
const VAN_CAPACITY = 80;
const HQ = [50.25854, -5.19544];   // hh_utils.py HQ_LAT / HQ_LON

let planDay     = null;        // 'YYYY-MM-DD' being planned
let planAdded   = new Set();   // referral ids put in the van, not yet booked
let planMatrix  = null;        // { key, ids, m: miles[from][to], approx }, index 0 = HQ
let planDrivers = { am: [], pm: [] };
let planMap = null, planLayer = null;
let planOpen    = new Set();   // referral ids whose wishlist is expanded

function togglePlanItems(id) {
  if (planOpen.has(id)) planOpen.delete(id); else planOpen.add(id);
  renderPlanner();
}

// To the referral's own card. The Planner button comes back to the same van.
function openFromPlanner(id) {
  setView('referrals');
  selectReferral(allReferrals.find(x => x.id === id));
}

// The wishlist, editable: the same editor as the referral card, showing each
// line's points. Clicks inside must not reach the row, which toggles the van.
function planItemsHtml(r) {
  return `<div class="plan-items" onclick="event.stopPropagation()">${wishlistEditorHtml(r, { editing: true, points: true })}</div>`;
}
// An empty <input type="date"> in Safari shows TODAY in grey, which read as
// "booked for today" on every row. So an unbooked row gets a button, and the
// date box only appears once there is a date or the button is pressed.
let planDateEditing = null;
function planDateCell(r) {
  if (!r.scheduled_date && planDateEditing !== r.id)
    return `<button class="plan-items-btn" onclick="event.stopPropagation(); planEditDate(${r.id})">Set date</button>`;
  return `<input type="date" class="plan-date" id="plan-date-${r.id}" value="${r.scheduled_date || ''}" title="Booked date: change or clear"
    onclick="event.stopPropagation()" onchange="planDateEditing = null; setPlanDate(${r.id}, this.value)"
    onblur="if (!this.value && planDateEditing === ${r.id}) { planDateEditing = null; renderPlanner(); }">`;
}
function planEditDate(id) {
  planDateEditing = id;
  renderPlanner();
  const el = document.getElementById('plan-date-' + id);
  if (el) { el.focus(); try { el.showPicker(); } catch (e) { /* not supported: the focused box is enough */ } }
}
const planRefLink = r => `<button class="dup-link" onclick="event.stopPropagation(); openFromPlanner(${r.id})" title="Open the referral">#${r.referral_number}</button>`;
const planItemsBtn = r => `<button class="plan-items-btn${planOpen.has(r.id) ? ' active' : ''}" onclick="event.stopPropagation(); togglePlanItems(${r.id})">${ICONS.list}<span>Items</span></button>`;

function loadKey(s) {          // order.mjs normName: what the Unit A list matches on
  return String(s ?? '').replace(/['’‘"]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}
// The load is the wishlist exactly as it stands. Admins trim it in the Items
// editor for stock and need, and the same list prints for the gatherers
// (Richard, 18 Oct 2026). Nothing is adjusted behind the scenes; the stock
// rules below only PROMPT, each with a one-tap fix.
function loadScore(items) {
  return (items || []).filter(it => !it.free_text && it.category)
    .reduce((t, it) => t + (Number(it.quantity) || 1) * (LOAD_POINTS[loadKey(it.description)] ?? LOAD_OTHER), 0);
}
const planLoad = r => loadScore(r.wishlist_items);

// Almost never on the shelf (Richard, 17 Oct 2026).
const RARELY_STOCKED = ['sideboard'];
// The most anyone is given: chests of drawers are so short that nobody gets
// more than one (Richard, 17 Oct 2026).
const MAX_GIVEN = { 'chest of drawers': 1 };

// What a wishlist asks for that will not go as asked: [{ text, fix, fixLabel }].
// fix is the correction that settles it, made only when the admin taps it.
function loadPrompts(r) {
  const out = [];
  for (const it of (r.wishlist_items || []).filter(i => !i.free_text && i.category)) {
    const k = loadKey(it.description), q = Number(it.quantity) || 1;
    if (RARELY_STOCKED.includes(k))
      out.push({ text: `${q > 1 ? q + ' x ' : ''}${it.description}: rarely in stock`, fixLabel: 'Remove',
                 fix: `wlRemoveItem(${r.id}, ${it.id})` });
    else if (MAX_GIVEN[k] != null && q > MAX_GIVEN[k])
      out.push({ text: `${q} x ${it.description}: only ${MAX_GIVEN[k]} given`, fixLabel: `Set to ${MAX_GIVEN[k]}`,
                 fix: `wlSetQuantity(${r.id}, ${it.id}, ${MAX_GIVEN[k]})` });
  }
  return out;
}
const planPromptTags = r => loadPrompts(r).map(p => `<span class="tag tag-wishlist plan-prompt">${esc(p.text)}
  <button onclick="event.stopPropagation(); ${p.fix}">${p.fixLabel}</button></span>`).join('');
const isBigOrder = r => planLoad(r) > VAN_CAPACITY;
const bigTitle = 'Big order: over a van as the list stands. Trim it in Items for what is in stock';
// Open deliveries with a wishlist in, gathered or not, that have a map location.
function planCandidates() {
  return allReferrals.filter(r => r.fulfilment_type === 'delivery' && r.wishlist_submitted_at
    && !r.completed_at && !r.cancelled_at && !r.duplicate_of && r.referral_number != null
    && r.clients?.latitude != null && r.clients?.longitude != null);
}

function haversineMiles([la1, lo1], [la2, lo2]) {
  const R = 3958.8, rad = x => x * Math.PI / 180;
  const a = Math.sin(rad(la2 - la1) / 2) ** 2 +
            Math.cos(rad(la1)) * Math.cos(rad(la2)) * Math.sin(rad(lo2 - lo1) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// Road miles between every pair, from the same OSRM table service the pickup
// suggestions use. One call for all ~15 deliveries. If it fails, straight-line
// miles x1.3 stand in and the panel says the figures are approximate.
async function planLoadMatrix(cands) {
  const key = cands.map(r => r.id).join(',');
  if (planMatrix?.key === key) return;
  const ids = cands.map(r => r.id);
  const pts = [HQ, ...cands.map(r => [Number(r.clients.latitude), Number(r.clients.longitude)])];
  try {
    const coords = pts.map(([la, lo]) => `${lo},${la}`).join(';');
    const res = await fetch(`https://router.project-osrm.org/table/v1/driving/${coords}?annotations=distance`);
    const j = await res.json();
    if (j.code !== 'Ok') throw new Error(j.code);
    planMatrix = { key, ids, m: j.distances.map(row => row.map(x => x / 1609.344)), approx: false };
  } catch (e) {
    console.warn('OSRM unavailable, using straight-line estimate:', e);
    planMatrix = { key, ids, m: pts.map(a => pts.map(b => 1.3 * haversineMiles(a, b))), approx: true };
  }
}
const planIdx = id => planMatrix.ids.indexOf(id) + 1;

// Shortest round trip from base through the stops, by trying every order.
// ponytail: exhaustive, fine to 7 drops (5040 orders); a van never carries that many.
function bestRoute(stops, m) {
  if (!stops.length) return { miles: 0, order: [] };
  let best = null;
  const walk = (rest, path, d) => {
    if (best && d >= best.miles) return;
    if (!rest.length) { const t = d + m[path[path.length - 1]][0]; if (!best || t < best.miles) best = { miles: t, order: path }; return; }
    rest.forEach((s, i) => walk(rest.filter((_, j) => j !== i), [...path, s], d + m[path.length ? path[path.length - 1] : 0][s]));
  };
  walk(stops, [], 0);
  return best;
}
const separateMiles = (stops, m) => stops.reduce((t, s) => t + m[0][s] + m[s][0], 0);

function planVan() {
  return planCandidates().filter(r => r.scheduled_date === planDay || planAdded.has(r.id));
}

// Things a crew needs to know before they agree to a pairing.
function planFlags(r) {
  const f = [];
  if (r.can_help_lift === false) f.push("Can't help lift");
  const notes = [r.referrer_notes, r.client_notes, r.wishlist_note].filter(Boolean).join(' ');
  if (/stair|steps|flight|floor|no lift|narrow|parking/i.test(notes)) f.push('Access notes');
  return f;
}

function nextWorkingDay(today = new Date()) {
  const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return ymd(d);
}

async function openPlanner() {
  planDay = planDay || nextWorkingDay();
  const el = document.getElementById('planner-view');
  if (!el.querySelector('#plan-map')) {
    el.innerHTML = `
      <div class="vol-view-header avail-header">
        <div style="flex:1"><h2>Delivery Planner</h2><div class="plan-sub">Van capacity = ${VAN_CAPACITY} pts</div></div>
        <label class="avail-week">Day <input type="date" class="vol-input plan-day" id="plan-day" onchange="setPlanDay(this.value)"></label>
      </div>
      <div class="plan-grid">
        <div id="plan-list" class="plan-list"><div class="loading">Loading…</div></div>
        <div class="plan-side"><div id="plan-van"></div><div id="plan-map" class="plan-map"></div></div>
      </div>`;
  }
  document.getElementById('plan-day').value = planDay;
  await Promise.all([planLoadMatrix(planCandidates()), planLoadDrivers(), planEnsureLeaflet()]);
  renderPlanner();
}

function setPlanDay(day) {
  if (!day) return;
  planDay = day;
  planAdded.clear();
  planLoadDrivers().then(renderPlanner);
}

async function planLoadDrivers() {
  const { data } = await db.from('volunteer_availability')
    .select('slot, volunteers(name, can_drive, active)').eq('day', planDay);
  planDrivers = { am: [], pm: [] };
  for (const row of data || []) {
    const v = row.volunteers;
    if (v?.can_drive && v.active) planDrivers[row.slot].push(v.name);
  }
  planDrivers.am.sort(); planDrivers.pm.sort();
}

function togglePlan(id) {
  const r = allReferrals.find(x => x.id === id);
  if (r.scheduled_date === planDay) {
    if (confirm(`Unbook #${r.referral_number} from ${fmtDay(planDay)}?`)) setPlanDate(id, null);
    return;
  }
  if (planAdded.has(id)) planAdded.delete(id); else planAdded.add(id);
  renderPlanner();
}

// The one write the planner makes: referrals.scheduled_date, which the
// referral's own card already shows as "Scheduled". Editable from any row.
async function setPlanDate(id, day) {
  const { error } = await db.from('referrals').update({ scheduled_date: day || null }).eq('id', id);
  if (error) { alert('Save failed: ' + error.message); renderPlanner(); return; }
  const r = allReferrals.find(x => x.id === id);
  r.scheduled_date = day || null;
  planAdded.delete(id);
  renderPlanner();
}

async function bookPlan() {
  const ids = [...planAdded];
  const { error } = await db.from('referrals').update({ scheduled_date: planDay }).in('id', ids);
  if (error) { alert('Booking failed: ' + error.message); return; }
  for (const r of allReferrals) if (ids.includes(r.id)) r.scheduled_date = planDay;
  planAdded.clear();
  renderPlanner();
}

function renderPlanner() {
  if (currentView !== 'planner' || !planMatrix) return;
  const m = planMatrix.m;
  const cands = planCandidates();
  const van = planVan();
  const vanStops = van.map(r => planIdx(r.id));
  const route = bestRoute(vanStops, m);
  const load = van.reduce((t, r) => t + planLoad(r), 0);
  const approx = planMatrix.approx ? ' (approx.)' : '';
  const name = r => [r.clients?.first_name, r.clients?.last_name].filter(Boolean).join(' ');
  const town = r => [postTown(r.clients), (r.clients?.postcode || '').toUpperCase()].filter(Boolean).join(', ');
  const pct = Math.min(100, Math.round(100 * load / VAN_CAPACITY));
  const unbooked = van.filter(r => planAdded.has(r.id)).length;

  document.getElementById('plan-van').innerHTML = `
    <div class="plan-panel">
      <div class="plan-panel-head">Van for ${fmtDay(planDay)}</div>
      <div class="plan-drivers">Drivers free: AM ${esc(planDrivers.am.join(', ') || 'none recorded')} · PM ${esc(planDrivers.pm.join(', ') || 'none recorded')}</div>
      <div class="plan-load ${load > VAN_CAPACITY ? 'over' : ''}">
        <div class="plan-load-bar"><span style="width:${pct}%"></span></div>
        <div>${Math.round(load)} of ${VAN_CAPACITY} points${load > VAN_CAPACITY
          ? (van.some(isBigOrder) ? ' — includes a big order: check what was gathered' : ' — over a van') : ''}</div>
      </div>
      ${van.length ? `
        <ol class="plan-stops">${route.order.map(i => { const r = van.find(x => planIdx(x.id) === i); return `
          <li><b>${planRefLink(r)}</b> ${esc(name(r))} <span class="plan-muted">${esc(town(r))} ·</span> <span class="${isBigOrder(r) ? 'plan-big' : 'plan-muted'}"${isBigOrder(r) ? ` title="${bigTitle}"` : ''}>${Math.round(planLoad(r))} pts</span>
            <div class="plan-stop-actions">
            ${planPromptTags(r)}
            ${planFlags(r).map(f => `<span class="tag tag-rejected">${f}</span>`).join('')}
            ${planAdded.has(r.id) ? '<span class="tag tag-wishlist">not booked</span>' : ''}
            ${planItemsBtn(r)}
            <button class="plan-items-btn plan-remove" onclick="togglePlan(${r.id})" aria-label="Remove #${r.referral_number} from the van">${ICONS.close}<span>Remove</span></button>
            </div>
            ${planOpen.has(r.id) ? planItemsHtml(r) : ''}</li>`; }).join('')}
        </ol>
        <div class="plan-muted">Round trip ${route.miles.toFixed(1)} mi${approx}${van.length > 1 ? `, against ${separateMiles(vanStops, m).toFixed(1)} mi as separate trips` : ''}</div>
        ${unbooked ? `<button class="btn-save-edit plan-book" onclick="bookPlan()">${ICONS.check}<span>Book ${unbooked} for ${fmtDay(planDay)}</span></button>` : ''}`
      : '<div class="plan-muted">Tap a delivery in the list or on the map to add it.</div>'}
    </div>`;

  // Everything not in the van, ranked by the road it would add to this van's
  // trip (on its own, that is its out-and-back from base).
  //
  // A delivery over a van on its own is a BIG ORDER, not "too big": the
  // wishlist is what was asked for, and a whole-house wishlist rarely goes in
  // full (Richard, 17 Oct 2026). Only the admin knows what was gathered, so
  // into an EMPTY van it is never greyed out. Once the van has something in
  // it, it greys out like anything else that would overfill it. Every row
  // stays clickable either way.
  const rows = cands.filter(r => !van.includes(r)).map(r => {
    const i = planIdx(r.id);
    const extra = bestRoute([...vanStops, i], m).miles - route.miles;
    const pts = planLoad(r);
    const big = pts > VAN_CAPACITY;
    return { r, extra, pts, big, fits: (big && !van.length) || load + pts <= VAN_CAPACITY };
  }).sort((a, b) => (b.fits - a.fits) || (a.extra - b.extra));

  document.getElementById('plan-list').innerHTML = `
    <div class="plan-list-head plan-row-top">
      <span class="plan-row-who">Delivery</span>
      <div class="plan-row-nums">
        <span class="plan-col-miles">${van.length ? 'Extra miles if added' : 'Round trip from base'}${approx}</span>
        <span class="plan-col-load">Load size</span>
        <span class="plan-col-actions"></span>
      </div>
    </div>
    ${rows.map(({ r, extra, pts, big, fits }) => `
      <div class="plan-row${fits ? '' : ' plan-nofit'}" id="plan-row-${r.id}" onclick="togglePlan(${r.id})"
        onmouseenter="planHighlight(${r.id}, true)" onmouseleave="planHighlight(${r.id}, false)">
        <div class="plan-row-top">
          <div class="plan-row-who"><b>${planRefLink(r)}</b> ${esc(name(r))} <span class="plan-muted" style="white-space:nowrap">${esc(town(r))}</span></div>
          <div class="plan-row-nums">
            <span class="plan-col-miles">${van.length ? '+' : ''}${extra.toFixed(1)} mi</span>
            <span class="plan-col-load ${fits ? '' : 'plan-over'}"><span class="${big ? 'plan-big' : ''}"${big ? ` title="${bigTitle}"` : ''}>${Math.round(pts)} pts${fits ? '' : " · won't fit"}</span></span>
            <span class="plan-col-actions">${planItemsBtn(r)}${planDateCell(r)}</span>
          </div>
        </div>
        <div class="plan-row-tags">
          ${r.gathered_at ? '<span class="tag tag-completed">Gathered</span>' : '<span class="tag tag-wishlist">Not gathered</span>'}
          ${planPromptTags(r)}
          ${planFlags(r).map(f => `<span class="tag tag-rejected">${f}</span>`).join('')}
        </div>
        ${planOpen.has(r.id) ? planItemsHtml(r) : ''}
      </div>`).join('') || '<div class="plan-muted" style="padding:12px">Every open delivery is in this van.</div>'}`;

  renderPlanMap(cands, van, route);
}

// Leaflet only loads when the planner is first opened.
function planEnsureLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    js.onload = resolve; js.onerror = reject;
    document.head.appendChild(js);
  });
}

function renderPlanMap(cands, van, route) {
  if (!window.L) return;
  if (!planMap) {
    planMap = L.map('plan-map', { scrollWheelZoom: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom: 18, attribution: '© OpenStreetMap contributors' }).addTo(planMap);
    planLayer = L.layerGroup().addTo(planMap);
    planMap.fitBounds([HQ, ...cands.map(r => [r.clients.latitude, r.clients.longitude])], { padding: [20, 20] });
  }
  planMap.invalidateSize();
  planLayer.clearLayers();
  const css = getComputedStyle(document.documentElement);
  const colour = v => css.getPropertyValue(v).trim();
  L.circleMarker(HQ, { radius: 7, color: colour('--text'), fillColor: colour('--text'), fillOpacity: 1 })
    .bindTooltip('Hidden Help').addTo(planLayer);
  if (van.length) {
    const ll = i => i === 0 ? HQ : (r => [r.clients.latitude, r.clients.longitude])(cands.find(x => planIdx(x.id) === i));
    L.polyline([0, ...route.order, 0].map(ll), { color: colour('--blue'), weight: 3, opacity: .7, dashArray: '6 6' })
      .addTo(planLayer);
  }
  planMarkers = {};
  for (const r of cands) {
    const inVan = van.includes(r);
    const c = inVan ? colour('--blue') : r.gathered_at ? colour('--green') : colour('--amber');
    const style = { radius: inVan ? 10 : 7, color: c, fillColor: c, fillOpacity: inVan ? .9 : .5, weight: 2 };
    const m = L.circleMarker([r.clients.latitude, r.clients.longitude], style)
      .bindTooltip(`#${r.referral_number} ${esc(r.clients.postcode || '')} · ${Math.round(planLoad(r))} pts`)
      .on('click', () => togglePlan(r.id))
      .on('mouseover', () => planRowHighlight(r.id, true))
      .on('mouseout', () => planRowHighlight(r.id, false))
      .addTo(planLayer);
    planMarkers[r.id] = { m, style };
  }
}

// And the other way: hovering a pin picks out its row, scrolling it into view
// if it is off screen (the map is sticky, so it stays put). A delivery in the
// van has no row in the list, so its pin highlights nothing.
function planRowHighlight(id, on) {
  const row = document.getElementById('plan-row-' + id);
  if (!row) return;
  row.classList.toggle('plan-row-hl', on);
  if (on) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// Hovering a row picks out its pin: bigger, dark ring, on top, label showing.
let planMarkers = {};
function planHighlight(id, on) {
  const p = planMarkers[id];
  if (!p) return;
  if (on) {
    p.m.setStyle({ radius: p.style.radius + 5, weight: 4, color: getComputedStyle(document.documentElement).getPropertyValue('--text').trim(), fillOpacity: 1 });
    p.m.bringToFront();
    p.m.openTooltip();
  } else {
    p.m.setStyle(p.style);
    p.m.closeTooltip();
  }
}

// NB: saveVolunteer(id, field, selectId) further down writes referral

async function saveVolunteerRecord(id) {

// Closed statuses in one place. A duplicate is closed work — it is not waiting
// for anything and must never sit in Open. This was three separate copies of the
// same array; adding a status to two of them and missing the third is the kind of
// bug that only shows up as a wrong count someone eventually stops trusting.
const CLOSED_STATUSES = ['completed', 'cancelled', 'rejected', 'duplicate'];
function isOpenStatus(status) { return !CLOSED_STATUSES.includes(status); }

// A referral still waiting to be triaged: no number, not marked a duplicate,
// not closed. This is the queue admin works from.
function isUntriaged(r) {
  return r.referral_number == null && !r.duplicate_of && !r.cancelled_at;
}

function deriveStatus(r) {
  // BEFORE the cancellation branch and derived from duplicate_of, never from
  // cancellation_type — that column defaults to 'cancelled' on every row, so
  // "unset" and "cancelled" are indistinguishable on it.
  if (r.duplicate_of)          return 'duplicate';
  if (r.cancelled_at)          return r.cancellation_type === 'rejected' ? 'rejected' : 'cancelled';
  if (r.completed_at)          return 'completed';
  if (r.gathered_at)           return 'gathered';
  if (r.wishlist_submitted_at) return 'awaiting gathering';
  // Below the milestone branches on purpose. The ingest stamps received_at on
  // every row at insert, so that branch fired the moment a referral arrived and
  // called it 'awaiting wishlist' before anyone had looked at it. Here it can only
  // displace that one label; at the top it would hide a gathered or completed row
  // behind a triage pill if one ever turned up unnumbered.
  if (isUntriaged(r))          return 'untriaged';
  if (r.received_at)           return 'awaiting wishlist';
  return 'new';
}

// The DB no longer allocates: a referral is inserted with no number and stays
// that way until admin writes one into "Client No." on Form Responses 1, which
// the ingest copies over (on the edit, plus the 7am/1pm passes). So a null number means "not triaged yet" — a normal state,
// not a fault — and it is the only state the star ever described.
//
// The "#1443*" star is gone with it. It meant "the DB minted this number and
// she may not have ratified it", a question that only existed while both sides
// allocated. Every number now arrives from her, so a numbered row is a
// confirmed row and the star could only ever have been noise. The last four
// rows it had anything to say about were cleared on 28 Aug: three duplicates
// parked at -id by a two-phase write that died mid-way, and #1535, minted by
// the sequence hours before the default was dropped and never allocated by her.
// The list uses '# —' instead — same width as a number, so unnumbered rows do
// not shove the tags onto a second line. The word survives in the detail header.
function refNumLabel(r) {
  return r.referral_number == null ? 'Unnumbered' : '#' + r.referral_number;
}

function crisisNames(r) {
  if (!r.referral_crisis_types) return [];
  return r.referral_crisis_types.map(rct => rct.crisis_types?.name).filter(Boolean);
}

function fmtDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: '2-digit' });
}

function fmtDateTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
    + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function toInputDatetime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function toInputDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

// ── List ────────────────────────────────────────────────────
// "Open" since 8 Oct 2026: wishlist in, not gathered, not posted — the
// referrals waiting on admin to send them to Telegram. It used to be every
// referral not completed, cancelled or rejected.
function isReadyToPost(r, status) {
  return status === 'awaiting gathering' && !r.telegram_posted_at;
}

function matchesStatusFilter(r, status) {
  const open = isOpenStatus(status);
  return statusFilter === 'all'    ? true
    : statusFilter === 'open'   ? isReadyToPost(r, status)
    : statusFilter === 'posted' ? open && !!r.telegram_posted_at
    : statusFilter === 'awaiting-wishlist' ? status === 'awaiting wishlist'
    : statusFilter === 'untriaged' ? isUntriaged(r)
    : status === statusFilter;  // completed | cancelled | rejected | duplicate
}

function matchesTypeFilter(r) {
  return typeFilter === 'all' || r.fulfilment_type === typeFilter;
}

// OS Places returns DPA.ADDRESS as '..., POST_TOWN, POSTCODE', stored verbatim
// in clients.geocoded_address, so the post town is the second-to-last comma
// field — dependent localities sit before it ('9 CHAPEL ROW, WIDEGATES, LOOE,
// PL13 1QB' is Looe, not Widegates). '' when the client was never geocoded.
function postTown(c) {
  const parts = String(c?.geocoded_address || '').split(',');
  return parts.length >= 2 ? titleCase(parts[parts.length - 2]) : '';
}

// Deliveries only: a specific town selection hides collections
function matchesTownFilter(r) {
  if (townFilter === 'all') return true;
  if (r.fulfilment_type !== 'delivery') return false;
  return postTown(r.clients) === townFilter;
}

function filterReferrals() {
  const filtered = allReferrals.filter(r => {
    const status = deriveStatus(r);
    const q = searchQuery.toLowerCase();

    // searching bypasses the filters so a search always finds the referral
    if (q) return [
      r.referral_number == null ? '' : String(r.referral_number),
      r.clients?.first_name, r.clients?.last_name,
      r.referrers?.name, r.referrers?.organisation,
      r.clients?.postcode,
      r.clients?.address, r.clients?.geocoded_address,
    ].filter(Boolean).some(v => v.toLowerCase().includes(q));

    return matchesStatusFilter(r, status) && matchesTypeFilter(r) && matchesTownFilter(r);
  });
  return filtered.sort((a, b) => {
    if (a.referral_number == null || b.referral_number == null) {
      if (a.referral_number === b.referral_number) return 0;
      return a.referral_number == null ? -1 : 1;   // unnumbered first, both ways
    }
    const diff = a.referral_number - b.referral_number;
    return sortAscending ? diff : -diff;
  });
}

function renderList() {
  updatePillCounts();
  const list    = document.getElementById('ref-list');
  const visible = filterReferrals();
  if (!visible.length) {
    list.innerHTML = '<div class="ref-list-empty">No referrals found</div>';
    return;
  }
  list.innerHTML = visible.map(r => {
    const status  = deriveStatus(r);
    const name    = clientName(r.clients);
    const town    = r.fulfilment_type === 'delivery' ? postTown(r.clients) : '';
    const isSelected = selectedRef?.id === r.id;
    return `
      <div class="ref-item${isSelected ? ' selected' : ''}" data-ref="${r.id}">
        <div class="ref-item-top">
          <div class="ref-id-tags">
            <span class="ref-num${r.referral_number == null ? ' unnumbered' : ''}"${r.referral_number == null ? ' title="Awaiting a number from the sheet"' : ''}>${r.referral_number == null ? '#&nbsp;—' : refNumLabel(r)}</span>
            <span class="tag tag-${r.fulfilment_type}">${r.fulfilment_type.charAt(0).toUpperCase() + r.fulfilment_type.slice(1)}</span>
            <span class="tag tag-${statusKey(status)}">${statusLabel(status)}</span>
          </div>
          <span class="ref-date">${fmtDate(r.received_at || r.created_at)}</span>
        </div>
        <div class="ref-name"><span>${esc(name)}</span>${town ? `<span class="ref-town">${esc(town)}</span>` : ''}</div>
      </div>`;
  }).join('');

  list.querySelectorAll('.ref-item').forEach(el => {
    el.addEventListener('click', () => {
      // Keyed on id, not referral_number: the number is a label that can change,
      // and once it is nullable "null" coerces to NaN and the row stops responding.
      const r = allReferrals.find(x => x.id === Number(el.dataset.ref));
      selectReferral(r);
    });
  });
}

function statusKey(s) {
  return { 'completed': 'completed', 'cancelled': 'cancelled', 'rejected': 'rejected', 'gathered': 'gathered',
           'awaiting gathering': 'gathered', 'awaiting wishlist': 'wishlist', 'untriaged': 'untriaged', 'new': 'new' }[s] || 'new';
}
function statusLabel(s) {
  return { 'completed': 'Completed', 'cancelled': 'Cancelled', 'rejected': 'Rejected', 'gathered': 'Gathered',
           'awaiting gathering': 'Awaiting gathering', 'awaiting wishlist': 'Awaiting wishlist', 'untriaged': 'Untriaged', 'new': 'New' }[s] || s;
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function titleCase(s) {
  return String(s).trim().replace(/\S+/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase());
}
function clientName(c) {
  return [c?.first_name, c?.last_name].filter(Boolean).map(titleCase).join(' ') || '—';
}

// Geocoder addresses arrive as "1, JAKES LANE, CHACEWATER, TRURO, TR4 8UF" —
// join a bare house number onto the street, title-case, keep the postcode as-is.
function fmtAddress(addr) {
  const parts = String(addr).split(', ').filter(Boolean);
  if (parts.length > 1 && /^\d+[A-Za-z]?$/.test(parts[0].trim())) {
    parts.splice(0, 2, parts[0].trim() + ' ' + parts[1]);
  }
  return parts.map(p =>
    /^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i.test(p.trim()) ? p.trim().toUpperCase() : titleCase(p).replace(/\b(\d+[a-z])\b/g, m => m.toUpperCase())
  );
}

// Storage is national form now; the +44 fold stays for rows typed by hand.
function fmtPhone(s) {
  if (!s) return '';
  const n = String(s).replace(/^\+44/, '0');
  return esc(n);
}

// Referrers sometimes give their own number as the client contact (rather than
// leaving it blank as the form asks) — compare last 10 digits so +44/0 agree.
function isReferrerPhone(clientPhone, refPhone) {
  const d = s => String(s || '').replace(/\D/g, '').slice(-10);
  return !!clientPhone && !!refPhone && d(clientPhone) === d(refPhone);
}

// Warning span for display only — fmtPhone also feeds plain-text emails.
// freeText: field may hold non-phone text; only assess it if it contains
// enough digits to look like an attempted phone number.
function phoneWarn(s, freeText) {
  if (!s) return '';
  const d = String(s).replace(/\D/g, '');
  if (freeText && d.length < 7) return '';
  const ok = (d.length === 11 && d[0] === '0') ||
             (d.length === 12 && d.startsWith('44') && d[2] !== '0');
  return ok ? '' : ` <span class="phone-warn">${ICONS.warn}Invalid number: please check</span>`;
}

// ── Pill counts ─────────────────────────────────────────────
function updatePillCounts() {
  // Faceted: each row's counts respect the other row's selection, so the
  // selected pills' counts are the intersection shown in the list.
  const statusCounts = { all: 0, untriaged: 0, open: 0, posted: 0, 'awaiting-wishlist': 0,
                         completed: 0, cancelled: 0, rejected: 0, duplicate: 0 };
  const typeCounts   = { all: 0, delivery: 0, collection: 0 };
  allReferrals.forEach(r => {
    const status = deriveStatus(r);
    const open = isOpenStatus(status);
    if (matchesTypeFilter(r) && matchesTownFilter(r)) {
      statusCounts.all++;
      if (isReadyToPost(r, status)) statusCounts.open++;
      if (isUntriaged(r)) statusCounts.untriaged++;
      if (open && r.telegram_posted_at) statusCounts.posted++;
      if (status === 'awaiting wishlist') statusCounts['awaiting-wishlist']++;
      if (status in statusCounts && !open) statusCounts[status]++;
    }
    if (matchesStatusFilter(r, status) && matchesTownFilter(r)) {
      typeCounts.all++;
      if (r.fulfilment_type in typeCounts) typeCounts[r.fulfilment_type]++;
    }
  });
  updateTownOptions();
  document.querySelectorAll('.pill[data-status], .pill[data-type]').forEach(btn => {
    const n = btn.dataset.status ? statusCounts[btn.dataset.status] : typeCounts[btn.dataset.type];
    const label = btn.dataset.label || btn.firstChild.textContent.trim();
    btn.dataset.label = label;  // cache on first run
    btn.innerHTML = label + `<span class="pill-sep">:</span><span class="pill-count">${n}</span>`;
  });
}

// Post town dropdown: deliveries only, counts faceted by status. A town with no
// deliveries under the active status pill drops out of the list entirely, so
// every option always reads a non-zero count. Deliveries with no post town
// (never geocoded) are not offered — they stay reachable via All areas/search.
function updateTownOptions() {
  const sel = document.getElementById("town-filter");
  const counts = new Map();
  allReferrals.forEach(r => {
    if (r.fulfilment_type !== 'delivery') return;
    const town = postTown(r.clients);
    if (!town || !matchesStatusFilter(r, deriveStatus(r))) return;
    counts.set(town, (counts.get(town) || 0) + 1);
  });
  const towns = [...counts.keys()].sort();
  sel.innerHTML = '<option value="all">All areas</option>'
    + towns.map(t => `<option value="${esc(t)}">${esc(t)} (${counts.get(t)})</option>`).join('');
  sel.value = [...sel.options].some(o => o.value === townFilter) ? townFilter : 'all';
  townFilter = sel.value;
  sel.classList.toggle('active', townFilter !== 'all');
}

document.getElementById("town-filter").addEventListener('change', e => {
  townFilter = e.target.value;
  renderList();
});

// ── Filters ─────────────────────────────────────────────────
// Two independent axes: status and fulfilment type, exclusive within each row
for (const axis of ['status', 'type']) {
  document.querySelectorAll(`.pill[data-${axis}]`).forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll(`.pill[data-${axis}]`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (axis === 'status') statusFilter = btn.dataset.status;
      else                   typeFilter   = btn.dataset.type;
      renderList();
    });
  });
}

document.getElementById('sort-btn').addEventListener('click', () => {
  sortAscending = !sortAscending;
  document.getElementById('sort-btn').textContent = sortAscending ? '↑' : '↓';
  renderList();
});

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', e => {
  searchQuery = e.target.value;
  renderList();
});
searchEl.addEventListener('search', () => {   // WebKit clear-button click
  searchEl.focus();
  if (searchQuery === searchEl.value) return;
  searchQuery = searchEl.value;
  renderList();
});

// ── Detail ──────────────────────────────────────────────────
function hasUnsavedChanges() {
  if (!selectedRef) return false;
  if (editingSection) return true;
  if (editingRefNum)  return true;
  const notes = document.getElementById('notes-area');
  if (notes && notes.value !== (selectedRef.notes || '')) return true;
  const reason = document.getElementById('cancel-reason');
  if (reason && reason.value.trim()) return true;
  const addr = document.getElementById('convert-address');
  if (addr && addr.value.trim() !== (selectedRef.clients?.address || '')) return true;
  const instr = document.getElementById('convert-instructions');
  if (instr && instr.value.trim() !== (selectedRef.collection_instructions || '')) return true;
  return false;
}

function confirmDiscard() {
  return !hasUnsavedChanges() || confirm('You have unsaved changes — discard them?');
}

window.addEventListener('beforeunload', e => {
  if (hasUnsavedChanges()) { e.preventDefault(); e.returnValue = ''; }
});

function selectReferral(r) {
  if (r === selectedRef) return;
  if (!confirmDiscard()) return;
  selectedRef     = r;
  editingSection  = null;
  editingRefNum   = false;
  showCancelForm  = false;
  showConvertForm = false;
  showWishlist    = false;
  showWlNote      = false;
  renderList();
  renderDetail(r);
  if (document.body.classList.contains('mobile')) {
    document.body.classList.add('showing-detail');
    const body = document.querySelector('#detail .detail-body');
    if (body) body.scrollTop = 0;
  }
}

function renderDetail(r) {
  const panel  = document.getElementById('detail');
  const status = deriveStatus(r);
  const client = r.clients || {};
  const ref    = r.referrers || {};
  const name   = clientName(client);
  const crises = crisisNames(r);
  // wishlist_items with null category are free-text (form column EP), not real
  // items — keep them out of the wishlist list.
  const items  = (r.wishlist_items || []).filter(it => it.category)
    .sort((a,b) => a.category.localeCompare(b.category) || a.description.localeCompare(b.description));
  const wishFreeText = (r.wishlist_items || []).filter(it => !it.category)
    .map(it => it.description).join('\n');

  // EP is the CLIENT's answer and belongs in the Client card. It used to be
  // appended to the referrer's notes, which put the client's own words under
  // somebody else's name — and made the Referrer card look like it held text
  // that was nowhere in referrals.referrer_notes.
  //
  // Read from client_notes first and fall back to the free-text row, because
  // which one holds it depends on when the referral arrived: the header
  // client_notes is filled from was stale from the rename until 1 Oct 2026, so
  // older referrals have only the wishlist_items row. New ones have both, and
  // they are the same sentence — hence the equality check rather than a join.
  //
  // Once client_notes is set it wins outright, '' included (admin cleared it):
  // it is what the PDF and the Telegram message print, and since 13 Oct 2026
  // admin can edit it on this card, so appending the original answer would put
  // back the words she just took out.
  const referrerNotes = r.referrer_notes || '';
  const clientNotes = r.client_notes != null ? r.client_notes : wishFreeText;
  const removals = activeRemovals(r);

  // On a partial match the card shows BOTH addresses, so admin can see what the
  // geocoder dropped or changed without opening the sheet — a lost flat number
  // or a moved house number is the whole point of the warning, and the matched
  // address alone never shows it. Needs both to be worth showing: with only one
  // there is nothing to compare and the labels would just be clutter.
  // NB "as given" is clients.address, which is whichever of the referral form or
  // the wishlist wrote last — the wishlist wins when the client corrected it.
  const showGiven = !!(client.geocode_partial && client.geocoded_address && client.address);

  const mapsLabel = client.geocoded_address || client.address || '';
  const mapsUrl = (client.latitude && client.longitude)
    ? `https://www.google.com/maps?q=${client.latitude},${client.longitude}${mapsLabel ? `(${encodeURIComponent(mapsLabel)})` : ''}`
    : null;
  // only posted-and-still-open referrals are on the map (same rule as the Posted filter pill)
  const onMap = !!r.telegram_posted_at && isOpenStatus(status);
  const deliveryMapUrl = (onMap && client.latitude && client.longitude)
    ? `https://hiddenhelp.github.io/delivery_map.html?ref=${r.referral_number}&lat=${client.latitude}&lon=${client.longitude}`
    : null;

  // Milestones view
  const msFields = [
    { label: 'Referral received',  field: 'received_at',          ts: r.received_at },
    { label: 'Wishlist submitted', field: 'wishlist_submitted_at', ts: r.wishlist_submitted_at },
    { label: 'Client contacted',   field: 'client_contacted_at',  ts: r.client_contacted_at },
    { label: 'Items gathered',     field: 'gathered_at',           ts: r.gathered_at },
    { label: r.fulfilment_type === 'delivery' ? 'Delivered' : 'Completed', field: 'completed_at', ts: r.completed_at },
  ];
  const firstPending = msFields.findIndex(m => !m.ts && status !== 'cancelled');

  const postedRow = r.telegram_posted_at ? `<div class="ms-row"><div class="ms-dot ms-dot-done"></div><span class="ms-label">Posted to Telegram</span><span class="ms-date">${fmtDateTime(r.telegram_posted_at)}</span></div>` : '';
  const milestonesView = msFields.map((m,i) => {
    const done = !!m.ts;
    const next = !done && i === firstPending;
    return (m.field === 'gathered_at' ? postedRow : '') + `<div class="ms-row">
      <div class="ms-dot ${done ? 'ms-dot-done' : next ? 'ms-dot-next' : 'ms-dot-pending'}"></div>
      <span class="ms-label">${m.label}</span>
      <span class="ms-date">${done ? fmtDateTime(m.ts) : '—'}</span>
    </div>`;
  }).join('')
  + (r.email_sent_at ? `<div class="ms-row"><div class="ms-dot ms-dot-done"></div><span class="ms-label">Emailed</span><span class="ms-date">${fmtDateTime(r.email_sent_at)}</span></div>`
     : r.email_drafted_at ? `<div class="ms-row"><div class="ms-dot ms-dot-done"></div><span class="ms-label">Email drafted</span><span class="ms-date">${fmtDateTime(r.email_drafted_at)}</span></div>` : '')
  + (r.gathered_by_id ? `<div class="ms-row"><div class="ms-dot ms-dot-done"></div><span class="ms-label">Gathered by</span><span class="ms-date">${esc(r.gathered_vol?.name || '—')}</span></div>` : '')
  + (r.delivered_by_id ? `<div class="ms-row"><div class="ms-dot ms-dot-done"></div><span class="ms-label">Delivered by</span><span class="ms-date">${esc(r.delivered_vol?.name || '—')}</span></div>` : '');

  const volOpts = (currentId) => `<option value="">— unassigned —</option>`
