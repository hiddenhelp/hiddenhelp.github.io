}

// Household size is recorded twice and the counted version wins.
//
// children_count holds whichever single-number answer arrived last: the referral
// form's "Number of children at the property", then overwritten by the
// wishlist's "Property occupants [Under 18s]" if that was answered
// (Supabase.gs). child_ages holds the wishlist's age-bracket matrix, which is
// counted per bracket.
//
// The brackets win because they are counted per age band while the single
// number is one answer to one question, and a household of six is far likelier
// to be itemised correctly than summarised correctly.
//
// Historical wrinkle worth knowing when reading old rows: until 28 Aug 2026 the
// Under 18s question topped out at the string "3+", which parseInt turned into
// 3. Fourteen rows still carry a children_count of 3 or 4 against brackets of 4
// to 8 because of it. The option is now "3" and "4", so new submissions parse
// cleanly and a disagreement means something real again.
//
// Either way the tooltip must not name a form: children_count holds whichever
// single-number answer arrived last, and it cannot tell you which.
function householdStat(label, wishlistTotal, referralCount, suffix) {
  const n = wishlistTotal != null ? wishlistTotal : (referralCount ?? '—');
  const disagrees = wishlistTotal != null && referralCount != null &&
                    wishlistTotal !== referralCount;
  const title = disagrees
    ? ` title="${wishlistTotal} counted from the age brackets; the household-size question says ${referralCount}."`
    : '';
  return `<div class="stat"${title}><label>${label}</label><span>${n}${suffix || ''}</span></div>`;
}

function sumCounts(obj) {
  if (!obj) return null;
  const vals = Object.values(obj).filter(v => typeof v === 'number');
  return vals.length ? vals.reduce((a, b) => a + b, 0) : null;
}

function formatChildAges(ages) {
  if (!ages || !Object.keys(ages).length) return '';
  const labels = { under_1:'<1', boy_1_3:'Boy 1–3', girl_1_3:'Girl 1–3',
    boy_4_7:'Boy 4–7', girl_4_7:'Girl 4–7', boy_8_11:'Boy 8–11',
    girl_8_11:'Girl 8–11', boy_12_plus:'Boy 12+', girl_12_plus:'Girl 12+' };
  const parts = Object.entries(ages)
    .filter(([,v]) => v > 0)
    .map(([k,v]) => `${labels[k]||k}${v>1?' ×'+v:''}`);
  if (!parts.length) return '';
  return `<div class="field"><label>Children</label><span>${parts.join(', ')}</span></div>`;
}

// Corrections are append-only; undo appends the inverse. See the comment on
// wishlist_corrections.previous_quantity for why deleting one cannot work.
function inverseCorrection(c) {
  if (c.action === 'remove')   return { action: 'add', description: c.description,
                                        category: c.category, quantity: c.quantity || 1 };
  if (c.action === 'add')      return { action: 'remove', description: c.description,
                                        category: c.category, quantity: c.quantity };
  if (c.action === 'quantity') return { action: 'quantity', description: c.description,
                                        quantity: c.previous_quantity || 1 };
  return null;
}

// Which removals are still in force: a remove with no later add of the same item.
function activeRemovals(r) {
  const seen = {};
  (r.wishlist_corrections || [])
    .slice()
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at) || a.id - b.id)
    .forEach(c => {
      const k = (c.description || '').trim().toLowerCase();
      if (c.action === 'remove')   seen[k] = c;
      else if (c.action === 'add') delete seen[k];
    });
  return Object.values(seen);
}

// Word-level, like wlSamePerson_ in wishlist_ingest.gs: a respelling keeps a
// word in common, a different person does not.
function sharesNameWord(a, b) {
  const words = s => String(s || '').toLowerCase().split(/[^a-z]+/).filter(w => w.length > 1);
  const wa = words(a), wb = words(b);
  return !wa.length || !wb.length || wa.some(w => wb.includes(w));
}

async function saveClient(id) {
  const r = allReferrals.find(x => x.id === id);
  if (!r?.client_id) { alert('This referral has no client record to edit.'); return; }
  const val = k => document.getElementById('ce-' + k)?.value.trim() ?? '';
  const first = val('first'), last = val('last');
  if (!first && !last) { alert('The client needs a name.'); return; }
  // The 7am reconcile and every wishlist submission check the sheet's name
  // against this one, and a name with no word in common reads as a mix-up:
  // the wishlist is refused and the morning report says the numbering drifted.
  if (!sharesNameWord(clientName(r.clients), first + ' ' + last) &&
      !confirm('"' + first + ' ' + last + '" has no name in common with "' + clientName(r.clients) + '".\n\n'
             + 'The sheet still has the old name, so a wishlist sent under it will be refused '
             + 'and the morning report will flag this referral. Save anyway?')) return;

  const { error } = await db.from('clients').update({
    first_name: first || null,
    last_name:  last || null,
    phone:      normalisePhone(val('phone')),
    client_secondary_contact: val('secondary') || null,
    vulnerable: !!document.getElementById('ce-vuln')?.checked,
  }).eq('id', r.client_id);
  if (error) { alert('Save failed: ' + error.message); return; }

  const lift = val('lift');
  editingSection = null;
  await patchReferral(id, {
    can_help_lift: lift === 'yes' ? true : lift === 'no' ? false : null,
    crisis_other_detail: val('crisis') || null,
    client_notes: val('notes'),   // '' is a decision, not a blank: see clientNotes
  });

}

// Flip a referral between delivery and collection.
//
// Goes through the Apps Script web app rather than patching Supabase directly,
// because a conversion is not just a field: a delivery needs coordinates, and
// geocoding needs OS_PLACES_API_KEY, which is a Script Property and has no
// business in a browser. Without them the referral has no Google Maps link, no
// Delivery Map link, no drive miles and no town — which is what the old
// convertToDelivery produced every time.
//
// No local fallback on purpose. A conversion that silently skips the geocode is
// exactly the half-done state this replaces; better to refuse and say why.
async function convertFulfilment(referralId, want) {
  const r = selectedRef; if (!r) return;
  if (typeof DRAFT_EMAIL_WEBAPP_URL === 'undefined' || !DRAFT_EMAIL_WEBAPP_URL) {
    alert('The Apps Script web app URL is not configured, so the address cannot be '
        + 'geocoded and the conversion would leave the referral off the map. '
        + 'Set DRAFT_EMAIL_WEBAPP_URL in config.js first.');
    return;
  }
  if (!r.referral_number) {
    alert('This referral has no number yet, so it cannot be converted. '
        + 'Put one in "Client No." on Form Responses 1 first.');
    return;
  }

  const btn = document.getElementById('convert-go');
  if (btn) { btn.disabled = true; btn.textContent = 'Converting…'; }
  try {
    const { data: { session } } = await db.auth.getSession();
    const body = {
      token: session.access_token,
      action: 'convertFulfilment',
      referral_number: r.referral_number,
      fulfilment_type: want,
    };
    if (want === 'delivery') {
      body.address           = document.getElementById('convert-address')?.value?.trim() || null;
      body.payment_recipient = document.getElementById('convert-pay-recipient')?.value || null;
      body.payment_method    = document.getElementById('convert-pay-method')?.value || null;
    } else {
      body.collection_instructions =
        document.getElementById('convert-instructions')?.value?.trim() || null;
      body.clear_payment = !!document.getElementById('convert-clear-payment')?.checked;
    }

    const res = await fetch(DRAFT_EMAIL_WEBAPP_URL, { method: 'POST', body: JSON.stringify(body) });
    const out = await res.json();
    if (out.error) throw new Error(out.error);

    showConvertForm = false;
    // Re-read rather than patching the local copy: the server may have written
    // coordinates, geocoded_address, geocode_partial and drive metrics onto the
    // client, and the address and map cards all render off those.
    await loadReferrals();

    if (out.warning) alert(out.warning);
    else if (out.geocode?.partial) {
      alert('Converted, but the geocode is a partial match: "' + out.geocode.matched
          + '". Check the address before anyone drives out.');
    }
  } catch (e) {
    console.error('Convert error:', e);
    alert('Conversion failed: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Confirm conversion'; }
  }
}

// Runs a web* action in DraftEmail.gs through Supabase's admin_jobs queue,
// which a one-minute Apps Script trigger drains (runAdminJobs). Unlike the web
// app — a deployment frozen at publish time that only admin can republish — a
// trigger runs whatever was last pushed, so a new action works straight away.
async function runAdminJob(action, args) {
  // One pending copy of a job at a time: a second click must not run it twice.
  const { data: dup, error: de } = await db.from('admin_jobs').select('id')
    .eq('action', action).eq('status', 'pending').contains('args', args).limit(1);
  if (de) throw new Error(de.message);
  if (dup.length) return { queued: true };
  const { data: job, error } = await db.from('admin_jobs')
    .insert({ action, args }).select('id').single();
  if (error) throw new Error(error.message);
  // runAdminJobs only works 8–11am (adminJobsOpen_ in DraftEmail.gs). Outside
  // that the job waits for 8am, so do not wait with it.
  const hour = +new Intl.DateTimeFormat('en-GB', { hour: 'numeric', hourCycle: 'h23',
                                                  timeZone: 'Europe/London' }).format(new Date());
  if (hour < 8 || hour >= 11) return { queued: true };
  const deadline = Date.now() + 3 * 60 * 1000;
  while (Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 4000));
    const { data: j, error: e } = await db.from('admin_jobs')
      .select('status,result').eq('id', job.id).single();
    if (e) throw new Error(e.message);
    if (j.status === 'done' || j.status === 'error') return j.result || {};
  }
  throw new Error('Nothing has picked this up after 3 minutes (job ' + job.id + '). '
    + 'It may still run — reload in a few minutes before trying again.');
}

// For a wishlist submitted under the wrong number: once admin corrects column B
// of "Form responses 2 New", this replays that row (webImportWishlist in
// DraftEmail.gs). A sheet edit never re-fires the form-submit trigger.
async function importWishlist(referralId) {
  const btn = document.getElementById('wl-import-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Importing… (up to a minute)'; }
  try {
    let out = await runAdminJob('importWishlist', { referral_id: referralId });
    // Out of hours, or already waiting. If the names turn out not to match, the
    // 8am run imports nothing and the button is still here to ask about it.
    if (out.queued) {
      alert('Imports run between 8am and 11am. The wishlist will be imported then.');
      return;
    }
    // The name typed on the form is not this referral's client. Often harmless
    // (a nickname, a married name, a support worker filling it in) — her call.
    if (out.name_mismatch) {
      const m = out.name_mismatch;
      if (!confirm('The names do not match.\n\n'
          + 'Wishlist (row ' + m.row + ' of Form responses 2 New) is signed:\n    ' + (m.typed || '(blank)') + '\n'
          + '#' + m.number + ' belongs to:\n    ' + (m.held || '(no name on file)') + '\n\n'
          + 'Import this wishlist onto #' + m.number + ' anyway?')) return;
      out = await runAdminJob('importWishlist', { referral_id: referralId, confirm_name: true });
    }
    if (out.error) throw new Error(out.error);
    await loadReferrals();
  } catch (e) {
    console.error('Import wishlist error:', e);
    alert('Import failed: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Import wishlist'; }
  }
}

async function deleteReferral(id) {
  const r = allReferrals.find(x => x.id === id);
  if (!r) return;
  const name = clientName(r.clients);

  // Anything can be deleted now — the common case is a referral whose sheet row
  // was removed, which never reaches "cancelled" and so could not be tidied away
  // under the old cancelled-only gate. In exchange the confirmation names what
  // goes with it, because a referral that has been worked on takes real history
  // with it and there is no undo.
  const losses = [];
  const items = (r.wishlist_items || []).length;
  if (items)                 losses.push(`${items} wishlist item${items === 1 ? '' : 's'}`);
  if (r.wishlist_submitted_at) losses.push(`the wishlist submitted ${fmtDate(r.wishlist_submitted_at)}`);
  if (r.completed_at)          losses.push(`a completion recorded ${fmtDate(r.completed_at)}`);
  const warn = losses.length
    ? `\n\nThis also destroys:\n  · ${losses.join('\n  · ')}`
    : '\n\nNothing has been recorded against it — no wishlist, no completion.';
  // The Telegram post is NOT deleted and never was, though this dialog used to
  // say it was. Nothing in the dashboard or the edge function can reach it: the
  // message id lives in the bot's SQLite on the Mini, not in Supabase. Say so,
  // because an orphaned post is worse than a converted one — the pinned index
  // scans the channel, so it would go on listing a referral that no longer
  // exists, with a Done button that patches nothing.
  const orphan = r.telegram_posted_at
    ? `\n\nThe Telegram post of ${fmtDate(r.telegram_posted_at)} is NOT deleted. ` +
      `Delete it in Telegram yourself, or it will stay in the channel — and in ` +
      `the pinned index — with no referral behind it.`
    : '';
  if (!confirm(`Permanently delete referral ${refNumLabel(r)} (${name}), ` +
               `received ${fmtDate(r.received_at || r.created_at)}?${warn}${orphan}` +
               `\n\nThis cannot be undone.`)) return;
  // Delete child rows first (no cascade on these FKs)
  await db.from('referral_crisis_types').delete().eq('referral_id', id);
  await db.from('wishlist_items').delete().eq('referral_id', id);
  await db.from('wishlist_raw').delete().eq('referral_id', id);
  const { error } = await db.from('referrals').delete().eq('id', id);
  if (error) { alert('Delete failed: ' + error.message); return; }
  allReferrals = allReferrals.filter(x => x.id !== id);
  selectedRef  = null;
  document.getElementById('detail').innerHTML = '';
  renderList();
}

// ── Notes ───────────────────────────────────────────────────
// ── Triage: number it, or mark it a duplicate ───────────────
// Two exits from one queue, not a flag on a numbered row. She triages, and the
// referral leaves the untriaged list either with a number or with duplicate_of
// set — which is why both buttons live on the same card.

// Highest allocated + 1, never a gap. Ruled 14 Sep 2026: a number withdrawn in
// error stays withdrawn. Gaps are harmless; two referrals sharing a number is
// not, and re-offering is exactly how that happens.
function nextFreeNumber() {
  const highest = allReferrals.reduce((n, r) => Math.max(n, r.referral_number || 0), 0);
  return highest + 1;
}

// Numbered referrals only: a duplicate points at the one that was kept, and an
// unnumbered row is not that. Never offers the referral being marked.
function duplicateMatches(r) {
  const q = duplicateQuery.trim().toLowerCase();
  if (!q) return [];
  return allReferrals
    .filter(x => x.id !== r.id && x.referral_number != null && !x.duplicate_of)
    .filter(x => String(x.referral_number).includes(q)
              || clientName(x.clients).toLowerCase().includes(q))
    .slice(0, 6);
}

async function assignNumber(id) {
  const input = document.getElementById('triage-num');
  const num = parseInt(input?.value, 10);
  if (!num || num < 1 || num > 99999) { alert('Enter a valid referral number (1-99999)'); return; }
  const clash = allReferrals.find(x => x.referral_number === num && x.id !== id);
  if (clash) {
    alert(`Referral number ${num} is already ${clientName(clash.clients)}. Choose a different number.`);
    return;
  }
  await patchReferral(id, { referral_number: num });
}

// duplicate_of AND cancelled_at together. Ruled 14 Sep 2026: "is this closed?"
// is already what the morning report, the bot's job list and this dashboard ask
// to decide whether something is live work, so stamping it means every one of
// them does the right thing without being changed.
async function markDuplicate(id, originalId) {
  const orig = allReferrals.find(x => x.id === originalId);
  const r    = allReferrals.find(x => x.id === id);
  if (!orig || !r) return;

  // The hint that the wrong one of the pair is about to be marked.
  const holds = [];
  if ((r.wishlist_items || []).length) holds.push(`${r.wishlist_items.length} wishlist item(s)`);
  if (r.wishlist_submitted_at) holds.push(`a wishlist submitted ${fmtDate(r.wishlist_submitted_at)}`);
  if (r.telegram_posted_at)    holds.push(`a Telegram post from ${fmtDate(r.telegram_posted_at)}`);
  if (holds.length && !confirm(
        `This referral holds ${holds.join(' and ')}.\n\n` +
        `That usually means it is the one to KEEP, and the other one is the duplicate. ` +
        `Mark it as a duplicate of ${refNumLabel(orig)} anyway?`)) return;

  showDuplicateSearch = false;
  duplicateQuery = '';
  await patchReferral(id, { duplicate_of: originalId, cancelled_at: new Date().toISOString() });
}

// Straight back into the untriaged queue. No confirmation — it is one reversible
// field, and confirmations on reversible things train you to click through the
// ones that matter.
async function unmarkDuplicate(id) {
  await patchReferral(id, { duplicate_of: null, cancelled_at: null });
}

// ── Wishlist editor ─────────────────────────────────────────
// One editor, two homes: the referral card's wishlist and the planner's Items
// panel (Richard, 18 Oct 2026). Every change is a correction through
// wlCorrect, so both pages, the planner's load, the PDF and the Telegram post
// all read the same list. It needs nothing but the referral, which is what
// lets it sit in either page.
//   editing: quantity boxes, remove buttons and the add row
//   points:  each line's load points, biggest first (the planner), in place of
//            its category
function wishlistEditorHtml(r, { editing = false, points = false } = {}) {
  const pts = it => (Number(it.quantity) || 1) * (LOAD_POINTS[loadKey(it.description)] ?? LOAD_OTHER);
  const fmtPts = n => (Math.round(n * 10) / 10) + ' pts';
  const items = (r.wishlist_items || []).filter(it => it.category)
    .sort(points ? (a, b) => pts(b) - pts(a) || a.description.localeCompare(b.description)
                 : (a, b) => a.category.localeCompare(b.category) || a.description.localeCompare(b.description));
  const removals = activeRemovals(r);
  const id = r.id;
  return `
    ${items.map(it => `
      <div class="item-row">
        ${editing ? `
          <input class="item-qty-input" type="number" min="1" max="99" value="${it.quantity}"
                 id="wq-${it.id}"
                 onchange="wlSetQuantity(${id}, ${it.id})">`
          : `<span class="item-qty">${it.quantity > 1 ? '×' + it.quantity : ''}</span>`}
        <span class="item-name">${esc(it.description)}${it.source === 'admin' ? '<span class="item-flag">added</span>' : ''}</span>
        ${points ? `<span class="item-pts">${fmtPts(pts(it))}</span>`
                 : `<span class="item-cat ic-${it.category || 'other'}">${it.category || 'free text'}</span>`}
        ${editing ? `
          <button class="item-drop" title="Take this off the list"
                  onclick="wlRemoveItem(${id}, ${it.id})">${ICONS.trash}</button>` : ''}
      </div>`).join('') || '<div class="item-row" style="color:var(--text3)">Nothing left on the list.</div>'}

    ${editing ? `
      <div class="item-add">
        <input id="wl-add-desc-${id}" class="item-add-desc" list="wl-item-list-${id}"
               placeholder="Item to add…" maxlength="80" autocomplete="off"
               oninput="wlAddDescChanged(${id})">
        <datalist id="wl-item-list-${id}">
          ${formItems.map(i => `<option value="${esc(i.item)}"></option>`).join('')}
        </datalist>
        <input id="wl-add-qty-${id}" class="item-add-qty" type="number" min="1" max="99" value="1">
        <select id="wl-add-cat-${id}" class="item-add-cat">
          <option value="general">General</option>
          <option value="electrical">Electrical</option>
          <option value="furniture">Furniture</option>
        </select>
        <button class="btn" onclick="wlAddItem(${id})">Add</button>
        <span class="item-add-hint" id="wl-add-hint-${id}"></span>
      </div>` : ''}

    ${removals.length ? `
      <div class="item-removed-block">
        <div class="item-removed-title">Taken off the list</div>
        ${removals.map(c => `
          <div class="item-removed">
            <span>${esc(c.description)}</span>
            <span class="item-removed-by">${fmtDate(c.created_at)}${c.created_by ? ' · ' + esc(c.created_by) : ''}</span>
            <button class="item-undo" onclick="wlUndo(${id}, ${c.id})">Put back</button>
          </div>`).join('')}
      </div>` : ''}`;
}

// ── Wishlist corrections ────────────────────────────────────
// wishlist_items is DERIVED: ingest_wishlist_submission rebuilds it on every
// submission, rebuild_wishlist_items rebuilds every referral after a vocabulary
// change. Editing it here directly would survive until the next rebuild and then
// vanish silently. So every change is a row in wishlist_corrections, and
// apply_wishlist_corrections re-materialises them at the end of both rebuilds.
async function wlCorrect(referralId, fields) {
  const { data: { user } } = await db.auth.getUser();
  const { error } = await db.from('wishlist_corrections').insert({
    referral_id: referralId,
    created_by:  user?.email || null,
    ...fields,
  });
  if (error) { alert('Could not save that correction: ' + error.message); return false; }
  const { error: applyErr } = await db.rpc('apply_wishlist_corrections', { p_referral_id: referralId });
  if (applyErr) { alert('Saved, but applying it failed: ' + applyErr.message); }
  await loadReferrals();
  return true;
}

// Picking a form item settles its category, so the dropdown follows the choice
// rather than asking again — and the hint says which heading it will print
// under, because that is the whole reason for picking from the list.
function wlAddDescChanged(referralId) {
  const desc = document.getElementById('wl-add-desc-' + referralId)?.value || '';
  const hint = document.getElementById('wl-add-hint-' + referralId);
  const cat  = document.getElementById('wl-add-cat-' + referralId);
  const it   = formItemFor(desc);
  if (it && cat) cat.value = it.category;
  if (!hint) return;
  hint.textContent = !desc.trim() ? ''
    : it ? `Section ${it.section} on the wishlist form — prints there on the PDF`
         : 'Not on the wishlist form — prints under "Other"';
}

async function wlAddItem(referralId) {
  const desc = (document.getElementById('wl-add-desc-' + referralId)?.value || '').trim();
  if (!desc) { document.getElementById('wl-add-desc-' + referralId)?.focus(); return; }
  const qty = parseInt(document.getElementById('wl-add-qty-' + referralId)?.value, 10) || 1;
  // A picked item carries its own category; the dropdown only decides for
  // something typed that is not on the form.
  const cat = formItemFor(desc)?.category
           || document.getElementById('wl-add-cat-' + referralId)?.value || 'general';
  await wlCorrect(referralId, { action: 'add', description: desc, quantity: qty, category: cat });
}

// Capture the row's category and quantity onto the correction: a remove
// hard-deletes the derived row, so the undo has nothing else to restore from.
async function wlRemoveItem(referralId, itemId) {
  const r  = allReferrals.find(x => x.id === referralId);
  const it = (r?.wishlist_items || []).find(i => i.id === itemId);
  if (!it) return;
  await wlCorrect(referralId, { action: 'remove', description: it.description,
                                category: it.category, quantity: it.quantity });
}

// The item is looked up by id, never passed in the markup. Until 18 Oct 2026
// the description went in as JSON.stringify(...) inside a double-quoted
// onchange="...", so its own quotes closed the attribute and every quantity
// edit died silently: no correction after the day the feature was built.
// qty: set it directly (the planner's "Set to 1"); otherwise read the box.
async function wlSetQuantity(referralId, itemId, qty) {
  const r  = allReferrals.find(x => x.id === referralId);
  const it = (r?.wishlist_items || []).find(i => i.id === itemId);
  if (!it) return;
  const previous = it.quantity;
  const input = document.getElementById('wq-' + itemId);
  if (qty == null) qty = parseInt(input?.value, 10);
  if (!qty || qty < 1 || qty > 99) { if (input) input.value = previous; return; }
  if (qty === previous) return;
  await wlCorrect(referralId, { action: 'quantity', description: it.description,
                                quantity: qty, previous_quantity: previous });
}

// Append the inverse — never delete the correction. The history stays truthful
// and a removed item comes back from what the removal recorded.
async function wlUndo(referralId, correctionId) {
  const r = allReferrals.find(x => x.id === referralId);
  const c = (r?.wishlist_corrections || []).find(x => x.id === correctionId);
  if (!c) return;
  const inv = inverseCorrection(c);
  if (!inv) return;
  await wlCorrect(referralId, inv);
}

// Through the web app (sendWishlistRequest) so it comes from admin whoever is
// signed in. Until admin publishes the version that has it, the deployment
// answers "unknown action" and this opens the same email in a Gmail compose
// tab, where she presses Send herself; that cannot report back, so it is not
// recorded as sent.
async function sendWishlistRequest() {
  const r = selectedRef; if (!r) return;
  const btn = document.getElementById('wishlist-link-btn');
  const mail = wishlistRequestEmail(r);
  if (!mail.to) { alert('This referrer has no email address on record.'); return; }
  const hasWebApp = typeof DRAFT_EMAIL_WEBAPP_URL !== 'undefined' && DRAFT_EMAIL_WEBAPP_URL;
  if (hasWebApp && !confirm(`Send the wishlist email for #${r.referral_number} to ${mail.to}?`)) return;
  const compose = () => window.open('https://mail.google.com/mail/?view=cm&fs=1'
    + `&to=${encodeURIComponent(mail.to)}&su=${encodeURIComponent(mail.subject)}`
    + `&body=${encodeURIComponent(mail.body)}`, '_blank');   // plain text only: no htmlBody here
  if (btn) btn.disabled = true;
  try {
    if (!hasWebApp) { compose(); return; }
    const { data: { session } } = await db.auth.getSession();
    const res = await fetch(DRAFT_EMAIL_WEBAPP_URL, {
      method: 'POST',
      body: JSON.stringify({ token: session.access_token, action: 'sendWishlistRequest',
                             referral_number: r.referral_number,
                             subject: mail.subject, body: mail.body, htmlBody: mail.htmlBody }),
    });
    const out = await res.json();
    if (out.error && /^unknown action/.test(out.error)) { compose(); return; }
    if (out.error) throw new Error(out.error);
    const ts = new Date().toISOString();
    const { error } = await db.from('referrals').update({ wishlist_request_sent_at: ts }).eq('id', r.id);
    if (error) console.error('wishlist_request_sent_at stamp failed:', error);
    else r.wishlist_request_sent_at = ts;
    renderDetail(r);
  } catch (e) {
    flashIconBtn(btn, ICONS.warn, 'Failed', ICONS.mail, 'Send wishlist email');
    alert('Wishlist email failed: ' + e.message);
  } finally {
    const b = document.getElementById('wishlist-link-btn');
    if (b) b.disabled = false;
  }
}

// mirrors the post-to-telegram edge function's household line
function buildHousehold(adultsCount, adultsBySex, childAges) {
  const parts = [];
  if (adultsBySex?.male)   parts.push(`${adultsBySex.male} x Adults Male`);
  if (adultsBySex?.female) parts.push(`${adultsBySex.female} x Adults Female`);
  if (!adultsBySex?.male && !adultsBySex?.female && adultsCount) parts.push(`${adultsCount} x Adults`);
  const labels = {
    under_1: 'Under 1', boy_1_3: 'Boy 1-3', girl_1_3: 'Girl 1-3',
    boy_4_7: 'Boy 4-7', girl_4_7: 'Girl 4-7', boy_8_11: 'Boy 8-11',
    girl_8_11: 'Girl 8-11', boy_12_plus: 'Boy 12+', girl_12_plus: 'Girl 12+',
  };
  if (childAges) {
    for (const [k, v] of Object.entries(childAges)) {
      if (v > 0) parts.push(`${v} x ${labels[k] || k}`);
    }
  }
  return parts.join(', ');
}

// PDF is generated server-side by the post-to-telegram edge function
// with mode:'pdf', so Telegram, PDF and Email all share one generator
async function fetchPdfBlob(r) {
  const { data: { session } } = await db.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/post-to-telegram`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${session.access_token}`,
    },
    body: JSON.stringify({ referral_number: r.referral_number, mode: 'pdf' }),
  });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { msg = (await res.json()).error || msg; } catch (_) {}
    throw new Error(msg);
  }
  return res.blob();
}

function buildEmailText(r) {
  const c = r.clients || {};
  const ref = r.referrers || {};
  const isDelivery = r.fulfilment_type === 'delivery';
  const name = [c.first_name, c.last_name].filter(Boolean).join(' ');
  const phone = isReferrerPhone(c.phone, ref.phone) ? 'contact referrer' : fmtPhone(c.phone);
  const address = isDelivery
    ? (c.geocoded_address || c.address || '')
    // The collection notes, as the Telegram post and the PDF have it. This read
    // r.notes, the back-office Admin notes card, until 20 Oct 2026.
    : (r.collection_instructions ? `Needed asap. Please contact to arrange: ${r.collection_instructions}` : 'Needed asap. Please contact to arrange.');
  const refPhone = fmtPhone(ref.phone);
  const refDetail = [refPhone, ref.organisation].filter(Boolean).join(', ');
  const household = buildHousehold(r.adults_count, r.adults_by_sex, r.child_ages);

  const lines = [
    isDelivery ? 'Delivery' : 'Collection',
    `${r.referral_number} — ${name} (${phone})`,
    address,
  ];
  if (c.client_secondary_contact) lines.push(`Second contact: ${c.client_secondary_contact}`);
  lines.push(`Referrer: ${ref.name || ''}${refDetail ? ` (${refDetail})` : ''}`);
  if (isDelivery && r.notes) lines.push(`Notes: ${r.notes}`);
  lines.push(`Household: ${household}`);
  lines.push('', 'PDF attached.');

  return lines.join('\n');
}

async function postWishlistTelegram() {
  const r = selectedRef; if (!r) return;
  if (r.telegram_posted_at && !confirm(`Already posted to Telegram ${fmtDateTime(r.telegram_posted_at)}.\n\nPost again?`)) return;
  const btn = document.getElementById('wl-tg-btn');
  btn.disabled = true;
  try {
    const { data: { session } } = await db.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/post-to-telegram`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ referral_number: r.referral_number }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    // edge function stamps telegram_posted_at server-side; mirror it locally
    r.telegram_posted_at = new Date().toISOString();
    if (body.message_id) r.telegram_message_id = body.message_id;
    renderList();
    renderDetail(r);

    // A repost retires the post it replaces. Say so only when it did NOT work,
    // because an orphaned post is not cosmetic: the pinned index is rebuilt by
    // scanning the channel, so the referral appears there twice and the stale
    // one still shows the old type with live buttons.
    if (body.previous_message_id && !body.previous_deleted) {
      alert('Posted — but the previous Telegram message could not be deleted:\n\n'
          + (body.previous_delete_error || 'unknown reason')
          + '\n\nDelete it in Telegram yourself, or this referral will show twice '
          + 'in the pinned index.');
    } else if (body.had_previous_untracked) {
      alert('Posted — but this referral was posted before message IDs were '
          + 'recorded, so the earlier message could not be found automatically.\n\n'
          + 'Delete the old post in Telegram yourself, or this referral will show '
          + 'twice in the pinned index.');
    }
  } catch (e) {
    flashIconBtn(btn, ICONS.warn, 'Failed', ICONS.send, 'Telegram');
    alert('Telegram post failed: ' + e.message);
    btn.disabled = false;
  }
}

// Sends the PDF to REFERRAL_EMAIL_RECIPIENT from admin's mailbox, after a
// confirmation: a sent email cannot be recalled (Richard, 19 Oct 2026; the
// draft step had stopped earning its keep). Until admin publishes the web app
// version that has sendEmail, the deployment answers "unknown action", and
// this makes the draft as before and says so, so nothing is lost in between.
async function emailReferralPdf() {
  const r = selectedRef; if (!r) return;
  const btn = document.getElementById('wl-email-btn');
  const subject = `*** REFERRAL ${r.referral_number} ***`;
  const hasWebApp = typeof DRAFT_EMAIL_WEBAPP_URL !== 'undefined' && DRAFT_EMAIL_WEBAPP_URL;
  if (hasWebApp && !confirm(`Send the PDF for #${r.referral_number} to ${REFERRAL_EMAIL_RECIPIENT}?`)) return;
  btn.disabled = true;
  try {
    let stamp = 'email_drafted_at';
    if (hasWebApp) {
      const { data: { session } } = await db.auth.getSession();
      const post = action => fetch(DRAFT_EMAIL_WEBAPP_URL, {
        method: 'POST',
        body: JSON.stringify({
          token: session.access_token, action,
          referral_number: r.referral_number,
          to: REFERRAL_EMAIL_RECIPIENT,
          subject,
          body: buildEmailText(r),
        }),
      }).then(res => res.json());
      let out = await post('sendEmail');
      if (out.error && /^unknown action/.test(out.error)) {
        out = await post('draftEmail');
        if (out.error) throw new Error(out.error);
        alert('Saved as a Gmail draft, NOT sent: sending is not switched on yet. '
            + 'It starts working when admin publishes the new version of the web app.');
        window.open('https://mail.google.com/mail/#drafts', '_blank');
      } else if (out.error) {
        throw new Error(out.error);
      } else {
        stamp = 'email_sent_at';
      }
    } else {
      // No web app configured: download the PDF for manual attach and open a
      // pre-filled Gmail compose tab.
      const blob     = await fetchPdfBlob(r);
      const blobUrl  = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl; a.download = `Referral ${r.referral_number}.pdf`; a.click();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
      window.open('https://mail.google.com/mail/?view=cm&fs=1'
        + `&to=${encodeURIComponent(REFERRAL_EMAIL_RECIPIENT)}`
        + `&su=${encodeURIComponent(subject)}`
        + `&body=${encodeURIComponent(buildEmailText(r))}`, '_blank');
    }

    const ts = new Date().toISOString();
    const { error } = await db.from('referrals').update({ [stamp]: ts }).eq('id', r.id);
    if (error) console.error(stamp + ' stamp failed:', error);
    else r[stamp] = ts;
    renderDetail(r);
  } catch (e) {
    flashIconBtn(btn, ICONS.warn, 'Failed', ICONS.mail, 'Email');
    alert('Email failed: ' + e.message);
    btn.disabled = false;
  }
}

async function openWishlistPdf() {
  const r = selectedRef; if (!r) return;
  const btn = document.getElementById('wl-pdf-btn');
  btn.disabled = true;
  flashIconBtn(btn, ICONS.printer, 'Generating…', ICONS.printer, 'PDF');
  try {
    const blob = await fetchPdfBlob(r);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch (e) {
    alert('PDF generation failed: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// ── Refresh ─────────────────────────────────────────────────
async function refreshSelected() {
  if (!confirmDiscard()) return;
  editingSection  = null;
  showCancelForm  = false;
  showConvertForm = false;
  await loadReferrals();
}

// ── Mobile portrait mode ────────────────────────────────────
function isMobileViewport() {
  return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    || window.matchMedia('(max-width: 768px)').matches
    || /[?&]mobile\b/.test(location.search);   // manual override for testing
}
function applyMobileMode() {
  const on = isMobileViewport();
  document.body.classList.toggle('mobile', on);
  if (!on) document.body.classList.remove('showing-detail');
}
function mobileBackToList() {
  if (!confirmDiscard()) return;
  editingSection = null; showCancelForm = false; showConvertForm = false;
  document.body.classList.remove('showing-detail');
  if (selectedRef) renderDetail(selectedRef);
}
applyMobileMode();
let _mobResizeT;
window.addEventListener('resize', () => { clearTimeout(_mobResizeT); _mobResizeT = setTimeout(applyMobileMode, 150); });

// ── Boot ────────────────────────────────────────────────────
initAuth();
</script>
